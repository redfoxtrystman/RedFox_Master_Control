; FalloutCraft: Fallout 4 with Minecraft physics, inventory and blocks.
; Goes in Data\F4SE\Plugins\ next to FalloutCraft.dll.

[Minecraft]
; Start Minecraft when Fallout 4 starts. It stays hidden (no window, no music), opens its FalloutCraft world
; by itself once you're in game, and quits when Fallout 4 closes. 0 = start Minecraft yourself.
bStartWithFallout 4 = 1

; Empty: the Minecraft that comes with FalloutCraft (a portable Prism Launcher, unpacked to
; %LOCALAPPDATA%\FalloutCraft; the first time it asks you to sign in with your Microsoft account).
; Or the full path of your own launcher (Prism, MultiMC, or a .bat file) to use that instead.
sLauncher =

; What to pass to your own launcher. For Prism: --launch and the FalloutCraft instance's folder name.
sArguments = --launch FalloutCraft

[Debug]
; Detailed timing, camera, combat and lighting logs in FalloutCraft.log (several lines a second), for
; reporting problems. 0 = off.
bDiagnostics = 0
