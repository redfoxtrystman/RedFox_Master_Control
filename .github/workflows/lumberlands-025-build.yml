name: LumberLands 0.2.5 Build
on:
  push:
    branches: [chatgpt-lumberlands-025-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work && mkdir -p work/project
          base64 -d .chatgpt_builds/lumberlands-0.2.5-source.b64 > work/source.zip
          unzip -q work/source.zip -d work/project
          test -f work/project/gradle.properties
          grep '^mod_version=0.2.5$' work/project/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Build all loaders
        working-directory: work/project
        run: gradle --no-daemon clean universalJar --stacktrace
      - name: Verify and collect jars
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          for f in             work/project/build/universal/LumberLands-0.2.5+1.21.1-universal.jar             work/project/fabric/build/libs/LumberLands-0.2.5+1.21.1-fabric.jar             work/project/forge/build/libs/LumberLands-0.2.5+1.21.1-forge.jar             work/project/neoforge/build/libs/LumberLands-0.2.5+1.21.1-neoforge.jar
          do
            test -s "$f"
            unzip -tq "$f"
            cp "$f" out/
          done
          sha256sum out/*.jar
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.2.5-compiled
          path: out/*.jar
          if-no-files-found: error
