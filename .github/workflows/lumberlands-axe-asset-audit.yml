name: LT2 Original Axe Asset Availability
on:
  push:
    branches: [chatgpt-lumberlands-axe-asset-research]
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check actual referenced Roblox mesh and axe textures
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, json, traceback
          dest=pathlib.Path('out'); dest.mkdir(exist_ok=True)
          ids=[145815658,145815673,290304565,290568345,333816720,517306801,540727894]
          records=[]
          for id in ids:
            url=f'https://assetdelivery.roblox.com/v1/asset/?id={id}'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'RobloxStudio/WinInet'})
              with urllib.request.urlopen(req,timeout=15) as r:
                blob=r.read(12000000)
                ctype=r.headers.get('Content-Type')
              (dest/f'roblox-{id}.bin').write_bytes(blob)
              records.append(dict(id=id,content_type=ctype,size=len(blob),head=blob[:64].hex(),status='ok'))
            except Exception as exc:
              records.append(dict(id=id,error=str(exc),status='error'))
          print(json.dumps(records,indent=2))
          (dest/'asset-audit.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lumberlands-original-axe-asset-audit
          path: out/*
          if-no-files-found: error
