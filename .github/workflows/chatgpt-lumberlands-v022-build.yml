name: Build LumberLands 0.2.2

on:
  push:
    branches:
      - chatgpt-lumberlands-v0.2.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct 0.2.0 source
        run: |
          rm -rf .chatgpt_builds/lumberlands_v022_src
          mkdir -p .chatgpt_builds/lumberlands_v022_src
          cat .chatgpt_builds/lumberlands_v020_full/chunk* | base64 -d > .chatgpt_builds/LumberLands-0.2.0-source.zip
          unzip -q .chatgpt_builds/LumberLands-0.2.0-source.zip -d .chatgpt_builds/lumberlands_v022_src

      - name: Reconstruct and overlay 0.2.1
        run: |
          cat             .chatgpt_builds/lumberlands_v021_delta/chunk00             .chatgpt_builds/lumberlands_v021_delta/chunk01             .chatgpt_builds/lumberlands_v021_delta/chunk02             .chatgpt_builds/lumberlands_v021_delta/c03_0             .chatgpt_builds/lumberlands_v021_delta/c03_1             .chatgpt_builds/lumberlands_v021_delta/c03_2_0             .chatgpt_builds/lumberlands_v021_delta/c03_2_1             .chatgpt_builds/lumberlands_v021_delta/c03_3             .chatgpt_builds/lumberlands_v021_delta/chunk04             .chatgpt_builds/lumberlands_v021_delta/c05_0             .chatgpt_builds/lumberlands_v021_delta/c05_1             .chatgpt_builds/lumberlands_v021_delta/c05_2             .chatgpt_builds/lumberlands_v021_delta/c05_3             .chatgpt_builds/lumberlands_v021_delta/c6_00             .chatgpt_builds/lumberlands_v021_delta/c6_01             .chatgpt_builds/lumberlands_v021_delta/c6_02             .chatgpt_builds/lumberlands_v021_delta/c6_03             .chatgpt_builds/lumberlands_v021_delta/c6_04             .chatgpt_builds/lumberlands_v021_delta/c6_05             | base64 -d > .chatgpt_builds/LumberLands-0.2.1-delta.zip
          echo "d4a62c5655cd1383cc8b640308a14628a707f1aa9c77e8065cf285cbbff0b82a  .chatgpt_builds/LumberLands-0.2.1-delta.zip" | sha256sum -c -
          unzip -qo .chatgpt_builds/LumberLands-0.2.1-delta.zip -d .chatgpt_builds/lumberlands_v022_src

      - name: Reconstruct and overlay 0.2.2
        run: |
          cat .chatgpt_builds/lumberlands_v022_delta/chunk00               .chatgpt_builds/lumberlands_v022_delta/chunk01               .chatgpt_builds/lumberlands_v022_delta/chunk02               | base64 -d > .chatgpt_builds/LumberLands-0.2.2-delta.zip
          echo "380f321090b4cb70919cb6fdbeb4226dba0400ff17c74c5a1d434d5d5c3b860c  .chatgpt_builds/LumberLands-0.2.2-delta.zip" | sha256sum -c -
          unzip -qo .chatgpt_builds/LumberLands-0.2.2-delta.zip -d .chatgpt_builds/lumberlands_v022_src

      - name: Correct LT2 centered part rendering during growth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.chatgpt_builds/lumberlands_v022_src/src/main/java/com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.java')
          s = p.read_text()
          old = '''applyDisplay(display, state(Lt2Visuals.barkBlock(section.unit.species)), section.start, section.rotation,
                        new Vec3(blocks(section.thickness), blocks(section.length), blocks(section.thickness)));'''
          new = '''applyDisplay(display, state(Lt2Visuals.barkBlock(section.unit.species)), sectionDisplayCorner(section.start, section.rotation, section.thickness), section.rotation,
                        new Vec3(blocks(section.thickness), blocks(section.length), blocks(section.thickness)));'''
          if old in s:
              s = s.replace(old, new)
          # LT2 leaf/tip Parts are centered on the branch tip. 0.2.1's extra
          # 0.75*height offset is what made End Times / SnowGlow tips float.
          s = s.replace(
              'Vec3 center = tip(section).add(rotate(section.rotation, new Vec3(0, 0.75 * size.y / 2.0, 0)));',
              'Vec3 center = tip(section);'
          )
          s = s.replace(
              'Vec3 center = worldEnd(s).add(rotate(q, new Vec3(0, 0.75 * size.y / 2.0, 0)));',
              'Vec3 center = worldEnd(s);'
          )
          s = s.replace(
              'Vec3 center = tip(s).add(rotate(s.rotation, new Vec3(0, 0.75 * size.y / 2.0, 0)));',
              'Vec3 center = tip(s);'
          )
          p.write_text(s)
          PY

      - name: Remove superseded Magma block-set assets
        run: |
          find .chatgpt_builds/lumberlands_v022_src/src/main/resources -type f \(             -name 'magma_log*' -o -name 'magma_wood*' -o -name 'magma_planks*'             -o -name 'stripped_magma_log*' -o -name 'stripped_magma_wood*'             -o -name 'magma_logs.json'           \) -print -delete
          rm -f \
            .chatgpt_builds/lumberlands_v022_src/src/main/resources/data/minecraft/tags/item/planks.json \
            .chatgpt_builds/lumberlands_v022_src/src/main/resources/data/minecraft/tags/item/logs.json \
            .chatgpt_builds/lumberlands_v022_src/src/main/resources/data/minecraft/tags/block/planks.json \
            .chatgpt_builds/lumberlands_v022_src/src/main/resources/data/minecraft/tags/block/logs.json
          stale=$(grep -RIl 'lumberlands:magma_' .chatgpt_builds/lumberlands_v022_src/src/main/resources 2>/dev/null || true)
          if [ -n "$stale" ]; then
            echo "ERROR: stale magma resource references remain:"
            echo "$stale"
            exit 1
          fi

      - name: Install texture build dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Fetch real Roblox pre-2022 material maps
        run: |
          set -euxo pipefail
          base='https://raw.githubusercontent.com/MaximumADHD/Roblox-Materials/main/PartsPre2022'
          root='.chatgpt_builds/lumberlands_v022_src/tools/roblox_materials'
          for material in Wood Concrete Grass Pebble Granite Slate Sand Foil; do
            mkdir -p "$root/$material"
            for map in color normal roughness metalness; do
              if curl -L --fail --retry 4 "$base/$material/$map.png" -o "$root/$material/$map.png"; then
                echo "Fetched Roblox pre-2022 $material/$map.png"
              else
                rm -f "$root/$material/$map.png"
                echo "No $map map for $material (expected for some materials)"
              fi
            done
          done

      - name: Generate LT2 Roblox material textures
        run: |
          cd .chatgpt_builds/lumberlands_v022_src
          cat > tools/generate_roblox_material_textures_pbr.py <<'PYGEN'
          #!/usr/bin/env python3
          """Generate LT2 surface sprites from Roblox's real pre-2022 PBR maps.

          BlockDisplay cannot run Roblox's material shader, so LumberLands keeps the
          real ColorMap pattern and bakes subtle Normal/Roughness/Metalness detail
          into the visible diffuse sprite. Neon/SmoothPlastic remain shader-style
          flat/fullbright because Roblox does not expose ordinary ColorMaps for them.
          """
          from pathlib import Path
          from PIL import Image, ImageStat
          import importlib.util, math

          ROOT = Path(__file__).resolve().parents[1]
          TEX = ROOT / "src/main/resources/assets/lumberlands/textures/block/lt2"
          MAT = ROOT / "tools/roblox_materials"

          spec=importlib.util.spec_from_file_location("basegen", ROOT/"tools/generate_roblox_material_textures.py")
          base=importlib.util.module_from_spec(spec); spec.loader.exec_module(base)
          MATERIAL=base.MATERIAL
          SPECIAL_FLAT=base.SPECIAL_FLAT

          def mean_rgb(im):
              return tuple(float(v) for v in ImageStat.Stat(im.convert("RGB")).mean)

          def tint_of(path):
              return tuple(round(v) for v in mean_rgb(Image.open(path).convert("RGB")))

          def patch(im, size=16):
              im=im.convert("RGB")
              side=min(im.width,im.height)
              x=(im.width-side)//2; y=(im.height-side)//2
              return im.crop((x,y,x+side,y+side)).resize((size,size),Image.Resampling.LANCZOS)

          def gray_patch(path, size=16, default=128):
              if not path.exists(): return Image.new("L",(size,size),default)
              im=Image.open(path)
              side=min(im.width,im.height)
              x=(im.width-side)//2; y=(im.height-side)//2
              return im.crop((x,y,x+side,y+side)).convert("L").resize((size,size),Image.Resampling.LANCZOS)

          def make(material,tint):
              if material in SPECIAL_FLAT:
                  return Image.new("RGB",(64,64),tint)
              color_path=MAT/material/"color.png"
              if not color_path.exists(): raise FileNotFoundError(color_path)
              col=patch(Image.open(color_path))
              normal=patch(Image.open(MAT/material/"normal.png")) if (MAT/material/"normal.png").exists() else None
              rough=gray_patch(MAT/material/"roughness.png",default=180)
              metal=gray_patch(MAT/material/"metalness.png",default=0)

              avg=mean_rgb(col)
              out=Image.new("RGB",(16,16)); cp=col.load(); op=out.load()
              np=normal.load() if normal else None; rp=rough.load(); mp=metal.load()
              # Fixed soft Roblox-like light direction, used only to make the real
              # normal/roughness structure visible in vanilla Minecraft's diffuse-only path.
              lx,ly,lz=(-0.35,0.45,0.82)
              ll=math.sqrt(lx*lx+ly*ly+lz*lz); lx/=ll;ly/=ll;lz/=ll
              for y in range(16):
                  for x in range(16):
                      r,g,b=cp[x,y]
                      vals=[t*c/max(1.0,a) for c,a,t in zip((r,g,b),avg,tint)]
                      shade=1.0
                      if np:
                          nr,ng,nb=np[x,y]
                          nx=(nr/255.0)*2-1; ny=(ng/255.0)*2-1; nz=(nb/255.0)*2-1
                          nl=max(1e-6,math.sqrt(nx*nx+ny*ny+nz*nz)); nx/=nl;ny/=nl;nz/=nl
                          lam=max(-1.0,min(1.0,nx*lx+ny*ly+nz*lz))
                          shade *= 0.86 + 0.20*((lam+1.0)*0.5)
                      rv=rp[x,y]/255.0
                      mv=mp[x,y]/255.0
                      shade *= 0.94 + (1.0-rv)*0.10
                      # Foil/metal patterns are mostly shader-driven; this retains the
                      # real metalness map instead of collapsing the material to a solid color.
                      shade *= 0.94 + mv*0.10
                      op[x,y]=tuple(max(0,min(255,round(v*shade))) for v in vals)
              tiled=Image.new("RGB",(64,64))
              for yy in range(0,64,16):
                  for xx in range(0,64,16): tiled.paste(out,(xx,yy))
              return tiled

          for stem,material in MATERIAL.items():
              p=TEX/(stem+".png")
              if not p.exists(): raise FileNotFoundError(p)
              tint=tint_of(p)
              make(material,tint).save(p)
              print(f"{stem}: Roblox pre-2022 {material} PBR maps x BrickColor {tint}")
          PYGEN
          python3 tools/generate_roblox_material_textures_pbr.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('src/main/resources/assets/lumberlands/textures/block/lt2')
          for name in ['lt2_generic_bark.png','lt2_generic_wood.png','lt2_generic_leaf0.png',
                       'lt2_lonecave_bark.png','lt2_lonecave_wood.png','lt2_snowglow_leaf0.png']:
              im=Image.open(root/name).convert('RGB')
              print(name, im.size, len(set(im.getdata())))
          assert len(set(Image.open(root/'lt2_generic_bark.png').convert('RGB').getdata())) > 8
          assert len(set(Image.open(root/'lt2_generic_wood.png').convert('RGB').getdata())) > 8
          assert len(set(Image.open(root/'lt2_generic_leaf0.png').convert('RGB').getdata())) > 8
          # Roblox's classic Foil ColorMap itself can be flat; its appearance comes
          # from its shader/PBR maps. We intentionally keep those original maps in
          # tools/roblox_materials rather than inventing a fake diffuse pattern.
          PY

      - name: Fix Fabric creative tab builder signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.chatgpt_builds/lumberlands_v022_src/fabric/src/main/java/com/glaziolaicefox/lumberlands/fabric/LumberLandsFabric.java')
          s=p.read_text().replace('CreativeModeTab.builder()', 'CreativeModeTab.builder(CreativeModeTab.Row.TOP, 0)')
          p.write_text(s)
          PY

      - name: Verify 0.2.2 source
        run: |
          root=.chatgpt_builds/lumberlands_v022_src
          grep -q '^mod_version=0.2.2$' "$root/gradle.properties"
          grep -q 'devGrowthSpeed' "$root/src/main/java/com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.java"
          grep -q 'sectionDisplayCorner' "$root/src/main/java/com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.java"
          grep -q 'applyImpulseAtPoint' "$root/src/main/java/com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.java"
          grep -q 'cutTop' "$root/src/main/java/com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.java"
          grep -q 'itemGroup.lumberlands' "$root/src/main/resources/assets/lumberlands/lang/en_us.json"
          grep -q 'Oak Tree Seed' "$root/src/main/resources/assets/lumberlands/lang/en_us.json"
          grep -q 'Elm Tree Seed' "$root/src/main/resources/assets/lumberlands/lang/en_us.json"
          grep -q 'End Times Tree Seed' "$root/src/main/resources/assets/lumberlands/lang/en_us.json"

      - name: Patch Forge 1.21.1 tick event registration if needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.chatgpt_builds/lumberlands_v022_src/forge/src/main/java/com/glaziolaicefox/lumberlands/forge/LumberLandsForge.java')
          s = p.read_text()
          if 'TickEvent.ServerTickEvent.Post.BUS.addListener' in s:
              if 'import net.minecraftforge.common.MinecraftForge;' not in s:
                  s = s.replace('import net.minecraftforge.event.TickEvent;\n',
                                'import net.minecraftforge.event.TickEvent;\nimport net.minecraftforge.common.MinecraftForge;\n')
              s = s.replace(
                  'TickEvent.ServerTickEvent.Post.BUS.addListener(event -> Lt2TreeRuntime.tick(event.getServer()));',
                  'MinecraftForge.EVENT_BUS.addListener((TickEvent.ServerTickEvent.Post event) -> Lt2TreeRuntime.tick(event.getServer()));'
              )
              p.write_text(s)
          PY

      - name: Package final source
        run: |
          cd .chatgpt_builds/lumberlands_v022_src
          zip -qr ../LumberLands-0.2.2-source.zip .

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build universal jar
        working-directory: .chatgpt_builds/lumberlands_v022_src
        run: gradle --no-daemon clean universalJar --stacktrace

      - name: Fabric startup smoke test
        working-directory: .chatgpt_builds/lumberlands_v022_src
        run: |
          mkdir -p fabric/run
          echo 'eula=true' > fabric/run/eula.txt
          set +e
          timeout 75s gradle --no-daemon :fabric:runServer > fabric-smoke.log 2>&1
          code=$?
          set -e
          cat fabric-smoke.log
          if grep -q "Could not execute entrypoint.*lumberlands" fabric-smoke.log; then exit 1; fi
          if grep -q "ExceptionInInitializerError" fabric-smoke.log; then exit 1; fi
          if grep -q "Failed to start the minecraft server" fabric-smoke.log; then exit 1; fi
          if grep -q "Done (" fabric-smoke.log; then exit 0; fi
          if [ "$code" -eq 124 ]; then exit 0; fi
          exit "$code"

      - name: Upload universal jar
        uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.2.2-1.21.1-universal
          path: .chatgpt_builds/lumberlands_v022_src/build/universal/*.jar
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.2.2-source
          path: .chatgpt_builds/LumberLands-0.2.2-source.zip
          if-no-files-found: error
