name: PKVault Gen1 Phantom Fix Build

on:
  push:
    branches:
      - chatgpt/pkvault-gen1-phantom-fix-20260923
    paths:
      - ".github/workflows/pkvault-gen1-phantom-fix-build.yml"

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Recreate exact v3 source
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v3chunks
          base="https://raw.githubusercontent.com/redfoxtrystman/RedFox_Master_Control/ddad36154d3deb5f8a76d59aebe4c5c4703f0967/tmp/pkvault-gen1-v3"
          files="final00.b64 final01.b64 final02.b64 final03.b64 final04p0.b64 final04p1.b64 final04p2.b64 final04p3_0.b64 final04p3_1.b64 final04p3_2.b64 final04p4.b64 final05.b64"
          for f in $files; do curl -fsSL "$base/$f" -o "/tmp/v3chunks/$f"; done
          cat /tmp/v3chunks/final00.b64 /tmp/v3chunks/final01.b64 /tmp/v3chunks/final02.b64 /tmp/v3chunks/final03.b64 /tmp/v3chunks/final04p0.b64 /tmp/v3chunks/final04p1.b64 /tmp/v3chunks/final04p2.b64 /tmp/v3chunks/final04p3_0.b64 /tmp/v3chunks/final04p3_1.b64 /tmp/v3chunks/final04p3_2.b64 /tmp/v3chunks/final04p4.b64 /tmp/v3chunks/final05.b64 > /tmp/v3.b64
          test "$(wc -c < /tmp/v3.b64)" -eq 41196
          echo "7b67adb072aa9508831a118b8a2e418df50bef6d7a8a4adcb60b66ef64013948  /tmp/v3.b64" | sha256sum -c -
          base64 -d /tmp/v3.b64 > /tmp/v3.tar.gz
          echo "e178b91aa15efb5584b1a08ad25c4826beb1ce07a7fa599a41bd9fc19dbcd2c2  /tmp/v3.tar.gz" | sha256sum -c -

          git clone https://github.com/Chnapy/PKVault.git pkvault
          cd pkvault
          git checkout 57e5ac226932ba2f20cf069a6cbfeb150ea4684c
          git submodule update --init --recursive
          tar -xzf /tmp/v3.tar.gz -C .
          sed -i '309,315{s/var scopedBox/var glitchScopedBox/; s/{scopedBox}/{glitchScopedBox}/}' PKVault.Core/storage/wrapper/ImmutablePKM.cs

      - name: Apply phantom-slot and Gen1 party-state fix
        run: |
          cd pkvault
          python3 - <<'PY'
          from pathlib import Path

          util = Path("PKVault.Core/utils/Gen1GlitchUtil.cs")
          s = util.read_text()

          s = s.replace(
              "for (var slot = 0; slot < 6; slot++)\n        {\n            if (sav.GetPartySlotAtIndex(slot) is PK1 pk1 && IsGlitch(pk1) && IsOccupied(pk1))",
              "for (var slot = 0; slot < Math.Min(sav.PartyCount, 6); slot++)\n        {\n            if (sav.GetPartySlotAtIndex(slot) is PK1 pk1 && IsOccupiedGlitch(pk1))",
              1,
          )
          s = s.replace(
              "if (pkms[slot] is PK1 pk1 && IsGlitch(pk1) && IsOccupied(pk1))",
              "if (pkms[slot] is PK1 pk1 && IsOccupiedGlitch(pk1))",
          )

          old = """        // SAV1.Write updates all normal save fields and checksums. It also packs
                  // storage, but its packer maps marker 00 to FF. We replace only the Gen 1
                  // Pokémon lists below and then recompute the RBY checksum.
                  var result = sav.Write().ToArray();

                  var offsets = sav.Japanese ? SAV1Offsets.JPN : SAV1Offsets.INT;"""
          new = """        // Capture party count BEFORE SAV1.Write(). PKHeX's stock Gen 1 packer
                  // treats raw species 00 as empty and can therefore lower PartyCount when
                  // a real 'M is present. Our writer restores the logical count below.
                  var logicalPartyCount = Math.Min(sav.PartyCount, 6);

                  // SAV1.Write updates all normal save fields and checksums. It also packs
                  // storage, but its packer maps marker 00 to FF. We replace only the Gen 1
                  // Pokémon lists below and then recompute the RBY checksum.
                  var result = sav.Write().ToArray();

                  var offsets = sav.Japanese ? SAV1Offsets.JPN : SAV1Offsets.INT;
                  // SAV1.Write mutates the backing save data as it packs. Restore the live
                  // session's logical party count so subsequent PKVault moves do not see a
                  // truncated/locked party after a raw-species-00 glitch Pokémon.
                  sav.Data[offsets.Party] = (byte)logicalPartyCount;"""
          if old not in s:
              raise SystemExit("GetSaveFileData anchor not found")
          s = s.replace(old, new, 1)

          old = """        var partyLength = PokeList1.GetListLength(6, sav.Japanese, party: true);
                  var party = new List<PK1>(6);
                  for (var slot = 0; slot < 6; slot++)
                  {
                      if (sav.GetPartySlotAtIndex(slot) is PK1 pk1)
                          party.Add(pk1);
                  }"""
          new = """        var partyLength = PokeList1.GetListLength(6, sav.Japanese, party: true);
                  var party = new List<PK1>(logicalPartyCount);
                  for (var slot = 0; slot < logicalPartyCount; slot++)
                  {
                      if (sav.GetPartySlotAtIndex(slot) is PK1 pk1)
                          party.Add(pk1);
                  }"""
          if old not in s:
              raise SystemExit("party packing anchor not found")
          s = s.replace(old, new, 1)

          start = s.index("    private static bool IsGlitch(PK1 pk1)")
          end = s.index("    private static bool HasNonBlankGen1Text", start)
          replacement = """    /// <summary>
              /// True only for a real occupied Generation 1 glitch Pokémon.
              ///
              /// A blank PK1 written through SetPartySlotAtIndex is mutated by PKHeX:
              /// ResetPartyStats gives it a calculated Lv.1 and party stats. Those bytes
              /// live after the Gen 1 stored body and must NEVER make a blank slot become
              /// a fake Lv.1 '?' Pokémon.
              /// </summary>
              public static bool IsOccupiedGlitch(PK1 pk1)
              {
                  if (pk1.Species != 0)
                      return false;

                  // Most MissingNo./glitch species have a non-zero raw RBY species byte
                  // which PKHeX maps to National species 0.
                  if (pk1.SpeciesInternal != 0)
                      return true;

                  // Raw species 00 ('M) is ambiguous with an empty PK1. Inspect only the
                  // STORED Gen 1 body. Party-only calculated level/stats are deliberately
                  // ignored. PKHeX may set boxed level to 1 on an empty slot, so ignore
                  // that one default byte too.
                  var data = pk1.Data;
                  var storedLength = Math.Min(PokeCrypto.SIZE_1STORED, data.Length);
                  for (var i = 0; i < storedLength; i++)
                  {
                      if (i == 3 && data[i] <= 1)
                          continue;
                      if (data[i] != 0)
                          return true;
                  }

                  if (HasNonBlankGen1Text(pk1.OriginalTrainerTrash))
                      return true;
                  if (HasNonBlankGen1Text(pk1.NicknameTrash))
                      return true;

                  return false;
              }

          """
          s = s[:start] + replacement + s[end:]
          util.write_text(s)

          immutable = Path("PKVault.Core/storage/wrapper/ImmutablePKM.cs")
          s = immutable.read_text()
          old = """    public bool IsGen1Glitch => Pkm is PK1 pk1
                  && Species == 0
                  && (pk1.SpeciesInternal != 0 || pk1.Data.ContainsAnyExcept<byte>(0));"""
          new = """    public bool IsGen1Glitch => Pkm is PK1 pk1
                  && Gen1GlitchUtil.IsOccupiedGlitch(pk1);"""
          if old not in s:
              raise SystemExit("ImmutablePKM IsGen1Glitch anchor not found")
          immutable.write_text(s.replace(old, new, 1))

          loader = Path("PKVault.Core/db/loader/save/SavePkmLoader.cs")
          s = loader.read_text()
          old = """    private void SetParty(List<ImmutablePKM> party)
              {
                  for (var slot = 0; slot < 6; slot++)
                  {
                      if (slot < party.Count)
                      {
                          var pkm = party[slot];
                          save.SetPartySlotAtIndex(pkm, slot);
                          if (pkm.IsEnabled)
                          {
                              SetDTO(
                                  CreateDTO(
                                      save, pkm, (int)BoxType.Party, slot
                                  )
                              );
                          }
                          else
                          {
                              save.SetPartySlotAtIndex(save.GetBlankPKM(), slot);
                              RemoveDTO((int)BoxType.Party, slot);
                          }
                      }
                      else
                      {
                          save.SetPartySlotAtIndex(save.GetBlankPKM(), slot);
                          RemoveDTO((int)BoxType.Party, slot);
                      }
                  }
              }"""
          new = """    private void SetParty(List<ImmutablePKM> party)
              {
                  // Work out logical occupancy BEFORE writing. PKHeX mutates PK1 objects
                  // while writing party stats, so testing IsEnabled after the write can
                  // turn a blank Gen 1 slot into a fake Lv.1 glitch Pokémon.
                  var logicalPartyCount = 0;
                  for (var slot = 0; slot < 6; slot++)
                  {
                      if (slot < party.Count)
                      {
                          var pkm = party[slot];
                          var isEnabled = pkm.IsEnabled;
                          if (isEnabled)
                              logicalPartyCount = slot + 1;

                          save.SetPartySlotAtIndex(pkm, slot);
                          if (isEnabled)
                          {
                              SetDTO(
                                  CreateDTO(
                                      save, pkm, (int)BoxType.Party, slot
                                  )
                              );
                          }
                          else
                          {
                              save.SetPartySlotAtIndex(save.GetBlankPKM(), slot);
                              RemoveDTO((int)BoxType.Party, slot);
                          }
                      }
                      else
                      {
                          save.SetPartySlotAtIndex(save.GetBlankPKM(), slot);
                          RemoveDTO((int)BoxType.Party, slot);
                      }
                  }

                  // PKHeX determines party occupancy from National species, where raw
                  // species 00 ('M) appears as species 0. Restore RBY's actual logical
                  // count after writes so a real 'M can occupy the final party slot and
                  // so a temporary hole does not truncate later party members.
                  if (save.GetSave() is SAV1 sav1)
                  {
                      var offsets = sav1.Japanese ? SAV1Offsets.JPN : SAV1Offsets.INT;
                      sav1.Data[offsets.Party] = (byte)logicalPartyCount;
                  }
              }"""
          if old not in s:
              raise SystemExit("SetParty anchor not found")
          loader.write_text(s.replace(old, new, 1))
          PY

      - name: Validate hotfix source
        run: |
          set -euxo pipefail
          cd pkvault
          grep -q "public static bool IsOccupiedGlitch" PKVault.Core/utils/Gen1GlitchUtil.cs
          grep -q "PokeCrypto.SIZE_1STORED" PKVault.Core/utils/Gen1GlitchUtil.cs
          grep -q "Math.Min(sav.PartyCount, 6)" PKVault.Core/utils/Gen1GlitchUtil.cs
          grep -q "sav.Data\[offsets.Party\] = (byte)logicalPartyCount" PKVault.Core/utils/Gen1GlitchUtil.cs
          grep -q "Gen1GlitchUtil.IsOccupiedGlitch(pk1)" PKVault.Core/storage/wrapper/ImmutablePKM.cs
          ! grep -q "pk1.Data.ContainsAnyExcept<byte>(0)" PKVault.Core/storage/wrapper/ImmutablePKM.cs
          grep -q "var isEnabled = pkm.IsEnabled" PKVault.Core/db/loader/save/SavePkmLoader.cs
          grep -q "sav1.Data\[offsets.Party\] = (byte)logicalPartyCount" PKVault.Core/db/loader/save/SavePkmLoader.cs

      - name: Build Windows x64 PKVault
        run: |
          docker build pkvault             --target desktop-publish             --build-arg RID=win-x64             -t pkvault-gen1-v4-win-x64:ci

      - name: Extract and verify
        run: |
          cid="$(docker create pkvault-gen1-v4-win-x64:ci)"
          mkdir -p publish-final
          docker cp "$cid":/app/publish-final/. publish-final/
          docker rm "$cid"
          test -f publish-final/PKVault.exe
          file publish-final/PKVault.exe
          sha256sum publish-final/PKVault.exe | tee publish-final/PKVault.exe.sha256
          printf '%s\n'             'PKVault Gen1 glitch v4 phantom-slot hotfix'             '- empty Gen1 party/box slots no longer become Lv.1 ? entries'             "- raw species 00 ('M) remains distinguishable from a blank slot"             '- party count is preserved across custom Gen1 serialization'             '- MissingNo sprite/card sizing fix from v3 retained'             > publish-final/GEN1-V4-FIXES.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PKVault-Gen1-MissingNo-v4-win-x64
          path: publish-final/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
