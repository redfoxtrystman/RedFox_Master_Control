name: LumberLands 0.3.8 Wiki and Original Axe Texture Fix
on:
  push:
    branches: [chatgpt-lumberlands-038-wiki-audit-textures]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore sources and apply LT2 reference corrections
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/project
          base64 -d .chatgpt_builds/lumberlands-0.3.0-source.b64 > work/source.zip
          unzip -q work/source.zip -d work/project
          cd work/project
          patch --batch --fuzz=0 -p4 < ../../.chatgpt_builds/lumberlands-0.3.0-to-0.3.1.patch
          python3 ../../.chatgpt_builds/lumberlands-032-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-033-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-034-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-035-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-036-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-037-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-038-upgrade.py
          grep -q '^mod_version=0.3.8' gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Compile universal Fabric Forge NeoForge JAR
        working-directory: work/project
        run: gradle --no-daemon clean universalJar --stacktrace
      - name: Verify JAR including decoded original PNG textures
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct,zlib
          p=Path('work/project/build/universal/LumberLands-0.3.8+1.21.1-universal.jar')
          assert p.is_file() and p.stat().st_size>1000000
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            entries=set(z.namelist())
            for name in ['fabric.mod.json','META-INF/mods.toml',
                         'META-INF/neoforge.mods.toml',
                         'assets/lumberlands/meshes/lt2_original_axe.bin',
                         'com/glaziolaicefox/lumberlands/client/Lt2OriginalAxeRenderer.class',
                         'com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.class']:
              assert name in entries,name
            for name in ['lt2_original_axe.png','lt2_original_hardened.png',
                         'lt2_original_beta.png','lt2_original_fire.png']:
              b=z.read('assets/lumberlands/textures/item/'+name)
              assert b[:8]==b'\x89PNG\r\n\x1a\n',f'{name} NOT decoded PNG: {b[:8].hex()}'
              assert b[12:16]==b'IHDR',name
              w,h=struct.unpack('>II',b[16:24])
              assert 32<=w<=4096 and 32<=h<=4096,(name,w,h)
              assert zlib.crc32(b[12:29]) & 0xffffffff == struct.unpack('>I',b[29:33])[0]
              print('VALID original axe PNG:',name,w,h,len(b))
          print('PASS: universal JAR valid; 4 original Roblox textures real PNG; all loader descriptors found.')
          PY
          mkdir -p out
          cp work/project/build/universal/LumberLands-0.3.8+1.21.1-universal.jar out/
          sha256sum out/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.3.8-universal
          path: out/LumberLands-0.3.8+1.21.1-universal.jar
          if-no-files-found: error
