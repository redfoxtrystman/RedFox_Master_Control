name: LumberLands 0.2.2 Decompile

on:
  push:
    branches:
      - chatgpt-lumberlands-0.2.3
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct 0.2.2 jar
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          base64 -d .chatgpt_builds/lumberlands-0.2.2-universal.b64 > work/LumberLands-0.2.2+1.21.1-universal.jar
          sha256sum work/LumberLands-0.2.2+1.21.1-universal.jar

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download CFR
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o work/cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          java -jar work/cfr.jar --version

      - name: Decompile classes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/decompiled
          java -jar work/cfr.jar work/LumberLands-0.2.2+1.21.1-universal.jar --outputdir work/decompiled --silent true
          find work/decompiled -type f | sort

      - name: Extract full jar resources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/jar-contents
          cd work/jar-contents
          jar xf ../LumberLands-0.2.2+1.21.1-universal.jar

      - name: Upload decompiled baseline
        uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.2.2-decompiled-baseline
          path: |
            work/decompiled
            work/jar-contents
          if-no-files-found: error
