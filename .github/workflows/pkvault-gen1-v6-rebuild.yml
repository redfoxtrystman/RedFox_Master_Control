name: PKVault V8 TMT ROM-Hack Compatibility

on:
  push:
    branches:
      - pkvault-v8-romhack-tmt
    paths:
      - 'pkvault-rebuild/**'
      - '.github/workflows/pkvault-v8-romhack-tmt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Checkout exact PKVault baseline
        run: |
          git clone https://github.com/Chnapy/PKVault.git pkvault-src
          cd pkvault-src
          git checkout 88993b8702a3ec7fc54b67ea1e2dbb1827822cec

      - name: Checkout exact PKHeX 26.08.26
        run: |
          git clone https://github.com/kwsch/PKHeX.git pkhex-src
          cd pkhex-src
          git checkout 74b88906e935e4a52d6d9243b8e373056409c738

      - name: Apply reconstructed v5 fixes plus Party-to-Box fix
        run: |
          python3 pkvault-rebuild/patch_pkvault_gen1.py pkvault-src pkhex-src
          git -C pkvault-src diff --check
          git -C pkhex-src diff --check

      - name: Apply V8 ROM-hack compatibility layer
        run: |
          python3 pkvault-rebuild/v8/patch_pkvault_v8.py pkvault-src pkhex-src
          git -C pkvault-src diff --check
          git -C pkhex-src diff --check

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build patched PKHeX.Core
        run: |
          dotnet build pkhex-src/PKHeX.Core/PKHeX.Core.csproj -c Release --nologo
          cp pkhex-src/PKHeX.Core/bin/Release/net10.0/PKHeX.Core.dll pkvault-src/PKVault.Core/PKHeX.Core.dll

      - name: Gen1 serializer smoke test
        run: |
          mkdir -p smoke
          cat > smoke/smoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="PKHeX.Core">
                <HintPath>../pkvault-src/PKVault.Core/PKHeX.Core.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          cat > smoke/Program.cs <<'EOF'
          using PKHeX.Core;

          static void Need(bool value, string message)
          {
              if (!value) throw new Exception(message);
          }

          var normal = new PK1();
          normal.Species = 25;
          normal.Stat_Level = 42;
          normal.EXP = 80000;

          var glitch = new PK1();
          glitch.SpeciesInternal = 0;
          glitch.CatchRate = 45;
          glitch.EXP = 12345;
          glitch.Stat_Level = 20;

          var missingno50 = new PK1();
          missingno50.SpeciesInternal = 0x50;
          missingno50.CatchRate = 45;
          missingno50.EXP = 54321;
          missingno50.Stat_LevelBox = 92;

          var blank = new PK1();

          var normalSingle = PokeList1.WrapSingle(normal);
          var glitchSingle = PokeList1.WrapSingle(glitch);
          var blankSingle = PokeList1.WrapSingle(blank);

          Need(normalSingle[0] == 1 && normalSingle[1] != 0 && normalSingle[1] != 0xFF,
              "normal Pokemon did not serialize as occupied");
          Need(glitchSingle[0] == 1 && glitchSingle[1] == 0,
              "raw-00 glitch was not preserved as occupied");
          Need(blankSingle[0] == 0 && blankSingle[1] == 0xFF,
              "blank PK1 became occupied");
          var missingno50Single = PokeList1.WrapSingle(missingno50);
          Need(PokeList1.IsKnownGen1Glitch(missingno50),
              "raw-50 MissingNo was not recognized as a supported Gen1 glitch");
          Need(missingno50Single[0] == 1 && missingno50Single[1] == 0x50,
              "raw-50 MissingNo was not serialized as occupied");

          var one = normalSingle.Length;
          var singles = new byte[one * 3];
          normalSingle.CopyTo(singles, 0);
          glitchSingle.CopyTo(singles, one);
          blankSingle.CopyTo(singles, one * 2);

          var stringLength = normal.OriginalTrainerTrash.Length;
          var box = new byte[PokeList1.GetListLength(3, false, false)];
          Need(PokeList1.MergeSingles(singles, box, stringLength, 3, false), "box merge failed");
          Need(box[0] == 2, "box count should contain normal + raw00 glitch");
          Need(box[1] == normal.SpeciesInternal, "normal Pokemon header corrupted");
          Need(box[2] == 0, "raw00 header corrupted");
          Need(box[3] == 0xFF && box[4] == 0xFF, "box empty/terminator markers invalid");

          var normalFromBox = PokeList1.ReadFromList(box, stringLength, 3, false, 0);
          var glitchFromBox = PokeList1.ReadFromList(box, stringLength, 3, false, 1);
          Need(normalFromBox.Species == 25, "Party->Box normal Pokemon became '?'");
          Need(glitchFromBox.SpeciesInternal == 0, "raw00 glitch did not round-trip");

          var party = new byte[PokeList1.GetListLength(3, false, true)];
          Need(PokeList1.MergeSingles(singles, party, stringLength, 3, true), "party merge failed");
          Need(party[0] == 2 && party[2] == 0, "party occupancy/raw00 preservation failed");

          Console.WriteLine("PASS: normal, blank, raw00, party and box Gen1 serialization");

          // Regression: a normal Pokemon placed in a Red box and then removed
          // before save must not resurrect as a raw-00 glitch after save/reload.
          var red = new SAV1(LanguageID.English, GameVersion.RB);
          red.SetBoxSlotAtIndex(normal.Clone(), 0, 0, EntityImportSettings.None);
          var blankForClear = red.BlankPKM;
          red.SetBoxSlotAtIndex(blankForClear, 0, 0, EntityImportSettings.None);
          var removedBytes = red.Write().ToArray();
          var redReload = new SAV1(removedBytes, LanguageID.English, GameVersion.RB);
          var resurrected = redReload.GetBoxData(0)
              .OfType<PK1>()
              .Count(PokeList1.IsOccupied);
          Need(resurrected == 0, $"vacated box slot resurrected as {resurrected} occupied Pokemon");

          // A genuine raw-00 glitch must still survive the same save/reload path.
          var glitchSave = new SAV1(LanguageID.English, GameVersion.RB);
          glitchSave.SetBoxSlotAtIndex(glitch.Clone(), 0, 0, EntityImportSettings.None);
          var glitchBytes = glitchSave.Write().ToArray();
          var glitchReload = new SAV1(glitchBytes, LanguageID.English, GameVersion.RB);
          var glitchRoundTrip = (PK1)glitchReload.GetBoxSlotAtIndex(0, 0);
          Need(PokeList1.IsRawZeroGlitch(glitchRoundTrip), "real raw-00 glitch was lost after SAV1 save/reload");

          // Raw-50 MissingNo must also survive box + party save paths.
          var missingSave = new SAV1(LanguageID.English, GameVersion.RB);
          missingSave.SetBoxSlotAtIndex(missingno50.Clone(), 0, 0, EntityImportSettings.None);
          var missingBytes = missingSave.Write().ToArray();
          var missingReload = new SAV1(missingBytes, LanguageID.English, GameVersion.RB);
          var missingRoundTrip = (PK1)missingReload.GetBoxSlotAtIndex(0, 0);
          Need(missingRoundTrip.SpeciesInternal == 0x50, "raw-50 MissingNo was lost after SAV1 box save/reload");

          var missingParty = new SAV1(LanguageID.English, GameVersion.RB);
          missingParty.PartyData = [missingno50.Clone()];
          Need(missingParty.PartyCount == 1, "raw-50 MissingNo was not counted as a party Pokemon");
          Need(((PK1)missingParty.PartyData[0]).SpeciesInternal == 0x50, "raw-50 MissingNo party marker was corrupted");

          Console.WriteLine("PASS: SAV1 vacated-slot, raw00 and raw50 regressions");
          EOF
          dotnet run --project smoke/smoke.csproj -c Release

      - name: Build PKVault Core with patched library
        run: |
          dotnet build pkvault-src/PKVault.Core/PKVault.Core.csproj -c Release --nologo

      - name: V8 Too Many Types compatibility smoke test
        run: |
          mkdir -p tmt-smoke
          cat > tmt-smoke/tmt-smoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../pkvault-src/PKVault.Core/PKVault.Core.csproj" />
              <Reference Include="PKHeX.Core">
                <HintPath>../pkvault-src/PKVault.Core/PKHeX.Core.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          cat > tmt-smoke/Program.cs <<'EOF'
          using PKHeX.Core;
          using PKVault.Core;

          static void Need(bool value, string message)
          {
              if (!value) throw new Exception(message);
          }

          var braixen = new PK3 { DirectSpeciesIDs = true };
          braixen.SpeciesInternal = 654;
          braixen.RefreshChecksum();
          Need(braixen.Species == 654, "raw 654 did not resolve to Braixen");
          Need(braixen.PersonalInfo.HP > 0, "expanded Braixen personal data fallback failed");
          Need(braixen.Clone().DirectSpeciesIDs, "PK3 clone lost direct-species mode");

          var ralts = new PK3 { DirectSpeciesIDs = true };
          ralts.SpeciesInternal = 280;
          Need(ralts.Species == 280, "TMT raw 280 did not resolve directly to Ralts");

          Need(Gen3DirectSpecies.TryGetRaw(77, 1, out var gPonyta) && gPonyta == 975,
              "Galarian Ponyta raw form constant mismatch");
          Need(Gen3DirectSpecies.TryGetRaw(745, 1, out var lycanrocN) && lycanrocN == 1173,
              "Lycanroc Midnight raw form constant mismatch");
          Need(Gen3DirectSpecies.TryGetRaw(746, 1, out var wishiwashiSchool) && wishiwashiSchool == 1175,
              "Wishiwashi School raw form constant mismatch");

          Need(TooManyTypesProfileGenerated.Supports(654, 0), "TMT roster missing Braixen");
          Need(TooManyTypesProfileGenerated.Supports(728, 0), "TMT roster missing Popplio");
          Need(!TooManyTypesProfileGenerated.Supports(722, 0), "Rowlet must not be accepted by TMT v1.6 roster");

          var wrappedBraixen = new ImmutablePKM(braixen);
          Need(TooManyTypesCompat.GetStorageExtension(wrappedBraixen) == "tmt3",
              "TMT storage extension was not preserved");
          var types = TooManyTypesCompat.GetTypes(wrappedBraixen);
          Need(types is ["Fire", "Magic", "Furry"], "Braixen TMT type metadata mismatch");

          var rawSave = new byte[SaveUtil.SIZE_G3RAW];
          for (var group = 0; group < 2; group++)
          {
              for (short sector = 0; sector < 14; sector++)
              {
                  var footer = ((group * 14) + sector) * 0x1000 + 0xFF4;
                  System.Buffers.Binary.BinaryPrimitives.WriteInt16LittleEndian(rawSave.AsSpan(footer, 2), sector);
              }
          }
          var tmtSave = new SAV3E(rawSave);
          Need(TooManyTypesCompat.ConfigureSave(tmtSave, "TooManyTypes_PUBLIC_v1.6.sav"),
              "TMT filename fingerprint did not activate profile");
          Need(tmtSave.DirectSpeciesIDs, "TMT save did not enter direct-species mode");
          Need(((SAV3E)tmtSave.Clone()).DirectSpeciesIDs, "SAV3E clone lost direct-species mode");

          var popplio7 = new PK7 { Species = 728 };
          var tmtPopplio = new PK3();
          TooManyTypesCompat.ApplyTmtIdentity(tmtPopplio, new ImmutablePKM(popplio7));
          Need(tmtPopplio.DirectSpeciesIDs && tmtPopplio.SpeciesInternal == 728 && tmtPopplio.Species == 728,
              "later-generation Popplio identity did not map into TMT");

          var directRalts = new PK3 { DirectSpeciesIDs = true };
          directRalts.SpeciesInternal = 280;
          directRalts.Move1 = 930;
          directRalts.RefreshChecksum();
          var vanilla = TooManyTypesCompat.ConvertDirectToVanilla(directRalts, new SAV3E());
          Need(!vanilla.DirectSpeciesIDs && vanilla.Species == 280,
              "TMT Ralts did not remap back to vanilla Gen3");
          Need(vanilla.Move1 == 0, "TMT custom move leaked into vanilla Gen3");
          Need(vanilla.SpeciesInternal != 280,
              "TMT direct raw species id was not remapped to vanilla Gen3 internal numbering");

          // Regression for alpha1 crash: normal DexGenService assumes every
          // species has StaticSpecies.Forms[EntityContext.Gen3]. Later-gen TMT
          // species do not, so TMT must use DexTmtService and never index that
          // vanilla Gen3 form dictionary.
          var dexSave = new SAV3E { DirectSpeciesIDs = true };
          var tmtDex = new DexTmtService(dexSave);
          var dex = new Dictionary<ushort, Dictionary<uint, DexItemDTO>>();
          await tmtDex.UpdateDexWithSave(dex, new StaticSpeciesData(), null);
          Need(dex.ContainsKey(654), "TMT dex did not include Braixen");
          var braixenDex = dex[654].Values.Single();
          Need(braixenDex.Forms.Count > 0, "TMT Braixen dex entry has no forms");
          Need(braixenDex.Forms.All(f => f.RomHackTypes is ["Fire", "Magic", "Furry"]),
              "TMT Braixen dex entry lost ROM-hack type metadata");

          Console.WriteLine("PASS: PKVault V8 TMT direct species, forms, roster, types, dex adapter, clone, storage and vanilla downgrade");
          EOF
          dotnet run --project tmt-smoke/tmt-smoke.csproj -c Release

      - name: PKVault Gen1 glitch enablement smoke test
        run: |
          mkdir -p vault-smoke
          cat > vault-smoke/vault-smoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../pkvault-src/PKVault.Core/PKVault.Core.csproj" />
              <Reference Include="PKHeX.Core">
                <HintPath>../pkvault-src/PKVault.Core/PKHeX.Core.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          cat > vault-smoke/Program.cs <<'EOF'
          using PKHeX.Core;
          using PKVault.Core;

          static void Need(bool value, string message)
          {
              if (!value) throw new Exception(message);
          }

          var raw00 = new PK1();
          raw00.SpeciesInternal = 0;
          raw00.CatchRate = 45;
          raw00.EXP = 12345;
          raw00.Stat_LevelBox = 20;

          var raw50 = new PK1();
          raw50.SpeciesInternal = 0x50;
          raw50.CatchRate = 45;
          raw50.EXP = 54321;
          raw50.Stat_LevelBox = 92;

          var blank = new PK1();

          Need(new ImmutablePKM(raw00).IsEnabled, "'M raw-00 should be enabled");
          Need(new ImmutablePKM(raw50).IsEnabled, "MissingNo raw-50 should be enabled");
          Need(!new ImmutablePKM(blank).IsEnabled, "blank PK1 must remain disabled");
          Need(new ImmutablePKM(raw00).IsGen1Glitch, "'M raw-00 glitch identity missing");
          Need(new ImmutablePKM(raw50).IsGen1Glitch, "MissingNo raw-50 glitch identity missing");

          Console.WriteLine("PASS: PKVault enables raw00 + raw50 glitches and rejects blank PK1");
          EOF
          dotnet run --project vault-smoke/vault-smoke.csproj -c Release

      - name: Direct trading two-profile end-to-end test
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          HARNESS="$ROOT/pkvault-rebuild/trading-smoke/trading-smoke.csproj"
          SEED_A="$ROOT/trade-test/seed-A"
          SEED_B="$ROOT/trade-test/seed-B"
          RUN_A="$ROOT/trade-test/run-A"
          RUN_B="$ROOT/trade-test/run-B"

          rm -rf "$ROOT/trade-test"
          mkdir -p "$SEED_A" "$SEED_B"

          dotnet build "$HARNESS" -c Release --nologo

          PKVAULT_PATH="$SEED_A" PKVAULT_TRADE_PROFILE="Trader-A" \
            dotnet run --no-build --project "$HARNESS" -c Release -- seed A
          PKVAULT_PATH="$SEED_B" PKVAULT_TRADE_PROFILE="Trader-B" \
            dotnet run --no-build --project "$HARNESS" -c Release -- seed B

          cp -a "$SEED_A" "$RUN_A"
          cp -a "$SEED_B" "$RUN_B"

          PKVAULT_PATH="$RUN_A" PKVAULT_TRADE_PROFILE="Trader-A" \
            dotnet run --no-build --project "$HARNESS" -c Release -- host > "$ROOT/trade-host.log" 2>&1 &
          HOST_PID=$!

          sleep 2

          PKVAULT_PATH="$RUN_B" PKVAULT_TRADE_PROFILE="Trader-B" \
            dotnet run --no-build --project "$HARNESS" -c Release -- join > "$ROOT/trade-join.log" 2>&1 &
          JOIN_PID=$!

          set +e
          wait "$HOST_PID"; HOST_RC=$?
          wait "$JOIN_PID"; JOIN_RC=$?
          set -e

          echo "===== HOST LOG ====="
          cat "$ROOT/trade-host.log"
          echo "===== JOIN LOG ====="
          cat "$ROOT/trade-join.log"

          test "$HOST_RC" -eq 0
          test "$JOIN_RC" -eq 0

          PKVAULT_PATH="$RUN_A" PKVAULT_TRADE_PROFILE="Trader-A" \
            dotnet run --no-build --project "$HARNESS" -c Release -- verify "66,92,147,123"
          PKVAULT_PATH="$RUN_B" PKVAULT_TRADE_PROFILE="Trader-B" \
            dotnet run --no-build --project "$HARNESS" -c Release -- verify "63,60,104,116,127,124,58,27"

          test ! -f "$RUN_A/pkvault-trade-pending.json"
          test ! -f "$RUN_B/pkvault-trade-pending.json"
          echo "PASS: uneven 2-for-1 trade + one-way gift completed over localhost:0000 and both profiles reloaded correctly"

          # Direct-IP path smoke test. This uses the runner's non-loopback IPv4
          # and the exact random port advertised by Host Direct.
          DIRECT_A="$ROOT/trade-test/direct-A"
          DIRECT_B="$ROOT/trade-test/direct-B"
          DIRECT_ADDR="$ROOT/trade-test/direct-address.txt"
          cp -a "$SEED_A" "$DIRECT_A"
          cp -a "$SEED_B" "$DIRECT_B"
          rm -f "$DIRECT_ADDR"

          PKVAULT_PATH="$DIRECT_A"             dotnet run --no-build --project "$HARNESS" -c Release -- direct-host "$DIRECT_ADDR" > "$ROOT/trade-direct-host.log" 2>&1 &
          DIRECT_HOST_PID=$!

          sleep 2

          PKVAULT_PATH="$DIRECT_B"             dotnet run --no-build --project "$HARNESS" -c Release -- direct-join "$DIRECT_ADDR" > "$ROOT/trade-direct-join.log" 2>&1 &
          DIRECT_JOIN_PID=$!

          set +e
          wait "$DIRECT_HOST_PID"; DIRECT_HOST_RC=$?
          wait "$DIRECT_JOIN_PID"; DIRECT_JOIN_RC=$?
          set -e

          echo "===== DIRECT HOST LOG ====="
          cat "$ROOT/trade-direct-host.log"
          echo "===== DIRECT JOIN LOG ====="
          cat "$ROOT/trade-direct-join.log"

          test "$DIRECT_HOST_RC" -eq 0
          test "$DIRECT_JOIN_RC" -eq 0
          test -s "$DIRECT_ADDR"
          ! grep -q '^localhost:' "$DIRECT_ADDR"
          echo "PASS: Host Direct advertised a non-loopback IP:random-port and a second PKVault connected to it"

      - name: Package complete v8.0.0-alpha2-TMT source snapshot
        run: |
          set -euo pipefail
          SOURCE_ROOT="$GITHUB_WORKSPACE/dist/PKVault-v8.0.0-alpha2-TMT-FULL-SOURCE"
          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"

          # These are the exact trees used by this successful build, after the
          # RedFox reconstruction patch has been applied.
          cp -a pkvault-src "$SOURCE_ROOT/PKVault"
          cp -a pkhex-src "$SOURCE_ROOT/PKHeX"
          cp -a pkvault-rebuild "$SOURCE_ROOT/RedFox-Rebuild"
          mkdir -p "$SOURCE_ROOT/GitHub-Workflow"
          cp .github/workflows/pkvault-gen1-v6-rebuild.yml "$SOURCE_ROOT/GitHub-Workflow/"

          # Do not ship nested Git history in the source archive.
          rm -rf "$SOURCE_ROOT/PKVault/.git" "$SOURCE_ROOT/PKHeX/.git"

          cat > "$SOURCE_ROOT/SOURCE_README.txt" <<'EOF'
          PKVault v8.0.0-alpha2-TMT FULL SOURCE
          ==========================
          Release line: V8 alpha2 ROM-Hack Compatibility + Too Many Types v1.6 + existing Trading/MissingNo support
          PKVault upstream baseline: Chnapy/PKVault 88993b8702a3ec7fc54b67ea1e2dbb1827822cec
          PKHeX upstream baseline: kwsch/PKHeX 74b88906e935e4a52d6d9243b8e373056409c738
          RedFox build branch: pkvault-v8-romhack-tmt

          Contents:
          - PKVault/        Exact patched PKVault source tree compiled for v8.0.0-alpha2-TMT.
          - PKHeX/          Exact patched PKHeX source tree used to build PKHeX.Core.
          - RedFox-Rebuild/ Reconstruction patcher, trading sources, and trading smoke harness.
          - GitHub-Workflow/Exact workflow used to reconstruct, test, package, and build v8.0.0-alpha2-TMT.
          - SOURCE_FILE_SHA256SUMS.txt hashes every file in this source snapshot.

          Reproduction:
          1. Build PKHeX/PKHeX.Core/PKHeX.Core.csproj with .NET 10 Release.
          2. Copy the resulting PKHeX.Core.dll to PKVault/PKVault.Core/PKHeX.Core.dll.
          3. Build PKVault normally or use its Dockerfile desktop target for win-x64.

          This archive exists specifically so future PKVault versions never depend on
          recovering source from an EXE or from a GitHub Actions runner.
          EOF

          (
            cd "$SOURCE_ROOT"
            find . -type f ! -name SOURCE_FILE_SHA256SUMS.txt -print0 |
              sort -z |
              xargs -0 sha256sum > SOURCE_FILE_SHA256SUMS.txt
          )

          (
            cd "$GITHUB_WORKSPACE/dist"
            zip -9 -r PKVault-v8.0.0-alpha2-TMT-FULL-SOURCE.zip PKVault-v8.0.0-alpha2-TMT-FULL-SOURCE
            sha256sum PKVault-v8.0.0-alpha2-TMT-FULL-SOURCE.zip > PKVault-v8.0.0-alpha2-TMT-FULL-SOURCE.zip.sha256
          )

      - name: Upload PKVault v8.0.0-alpha2-TMT full source
        uses: actions/upload-artifact@v4
        with:
          name: PKVault-v8.0.0-alpha2-TMT-FULL-SOURCE
          path: |
            dist/PKVault-v8.0.0-alpha2-TMT-FULL-SOURCE.zip
            dist/PKVault-v8.0.0-alpha2-TMT-FULL-SOURCE.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Build Windows x64 PKVault executable
        run: |
          cd pkvault-src
          docker build . --target desktop --build-arg RID=win-x64 --build-arg VERSION=0.0.0-trading-v8.0.0-alpha2-TMT -t pkvault-v752-description-patch
          docker create --name pkvault-v752-description-patch-out pkvault-v752-description-patch
          mkdir -p ../dist
          docker cp pkvault-v752-description-patch-out:/app/PKVault.exe ../dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test-win-x64.exe
          docker rm pkvault-v752-description-patch-out

      - name: Package two isolated Windows trading profiles
        run: |
          set -euo pipefail
          mkdir -p dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test/Trader-A
          mkdir -p dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test/Trader-B

          cp dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test-win-x64.exe \
            dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test/Trader-A/PKVault-Trader-A.exe
          cp dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test-win-x64.exe \
            dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test/Trader-B/PKVault-Trader-B.exe

          cp -a trade-test/seed-A/. dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test/Trader-A/
          cp -a trade-test/seed-B/. dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test/Trader-B/

          cat > dist/PKVault-v8.0.0-alpha2-TMT-Online-Trading-Dex-Test/TESTING.txt <<'EOF'
          PKVault v8.0.0-alpha2-TMT Online/VPN Trading + Permanent Dex Registration test
          ===================================
          Trader A starts with:
            Abra, Growlithe, Machop, Gastly, Dratini, Scyther
          Trader B starts with:
            Sandshrew, Poliwag, Cubone, Horsea, Pinsir, Jynx

          Local self-test:
          1. Open Trader-A/PKVault-Trader-A.exe.
          2. Open Trader-B/PKVault-Trader-B.exe.
          3. Optional: open Settings > Trading and change Player name. Trader A/B are pre-seeded as "Trader A" and "Trader B".
          4. Stay on Storage. In one pane choose Trading from the same source selector that contains PKVault and save files.
          5. Leave the opposite pane on PKVault so you can browse its normal box tabs.
          6. Trader A: in the Trading pane click Host Local.
          7. Trader B: choose Trading in one pane, leave localhost:0000 in the address box, and click Connect.
