      - name: Package V8 alpha33 truly clean Windows profile
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          OUT="$ROOT/dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN"
          EXE="$ROOT/dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.exe"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp "$EXE" "$OUT/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex.exe"

          cat > "$OUT/README.txt" <<'EOF'
          PKVault V8.0.0 alpha33 - CLEAN PROFILE
          ======================================
          This package contains NO seeded PKVault database, NO TMT compatibility
          Pokemon, and NO preloaded storage records.

          Use this executable for your real Pokémon Uranium / Insurgence / normal
          PKVault testing.

          Alpha33:
          - normal Uranium/Insurgence party -> PKVault drags are real moves
          - occupied PKVault slots are preflighted before an Essentials swap
          - an incompatible occupant is rejected before either side is changed
          - Uranium PKEssentials records retain their profile/local-species data
            in .pkessentials central-vault files
          EOF

          test ! -d "$OUT/TMT-Type-Test"
          test ! -d "$OUT/Uranium-Random-Test"
          test -z "$(find "$OUT" -type f \( -name 'compat-tmt-*' -o -name '*.tmt3' \) -print -quit)"

          (
            cd "$ROOT/dist"
            zip -9 -r PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN-win-x64.zip PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN
            ! unzip -l PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN-win-x64.zip | grep -q 'compat-tmt-'
            ! unzip -l PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN-win-x64.zip | grep -q 'TMT-Type-Test'
            sha256sum PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN-win-x64.zip > PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN-win-x64.zip.sha256
          )

      - name: Upload V8 alpha33 truly clean Windows profile
        uses: actions/upload-artifact@v4
        with:
          name: PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN-win-x64
          path: |
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN-win-x64.zip
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-CLEAN-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Package V8 alpha33 isolated compatibility test profiles
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          OUT="$ROOT/dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-COMPATIBILITY-TEST-PROFILES"
          EXE="$ROOT/dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.exe"
          rm -rf "$OUT"
          mkdir -p "$OUT/TMT-Type-Test" "$OUT/Uranium-Random-Test"

          cp "$EXE" "$OUT/TMT-Type-Test/PKVault-TMT-Type-Test.exe"
          cp -a "$ROOT/tmt-type-test-profile/." "$OUT/TMT-Type-Test/"

          cp "$EXE" "$OUT/Uranium-Random-Test/PKVault-Uranium-Random-Test.exe"
          cp -a "$ROOT/uranium-random-test/." "$OUT/Uranium-Random-Test/"

          cat > "$OUT/README.txt" <<'EOF'
          PKVault V8.0.0 alpha33 - ISOLATED COMPATIBILITY TEST PROFILES
          ============================================================
          These folders are intentionally PRE-SEEDED and are NOT the clean build.

          TMT-Type-Test/
            Contains the 55-Pokémon compatibility profile, including
            compat-tmt-01 (the seeded Too Many Types Ralts).

          Uranium-Random-Test/
            Contains a disposable Uranium.rxdata stress-test save and its own EXE.

          Keep these test folders separate from the clean alpha33 executable.
          EOF

          cat > "$OUT/TMT-Type-Test/TMT_TYPE_TESTING.txt" <<'EOF'
          The TMT profile contains 55 seeded Pokémon spanning TMT3, PK3, PK2 and
          PK1. compat-tmt-01 is the seeded Too Many Types Ralts. This profile is
          for compatibility testing only and must not be mistaken for a clean
          central PKVault.
          EOF

          cat > "$OUT/Uranium-Random-Test/URANIUM_RANDOM_TESTING.txt" <<'EOF'
          Uranium.rxdata is a disposable stress-test save containing one party
          Raptorch plus 60 deterministic random Uranium Pokémon in PC boxes.
          Do not overwrite your real Pokémon Uranium save with this test copy.
          EOF

          (
            cd "$ROOT/dist"
            zip -9 -r PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-COMPATIBILITY-TEST-PROFILES-win-x64.zip PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-COMPATIBILITY-TEST-PROFILES
            sha256sum PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-COMPATIBILITY-TEST-PROFILES-win-x64.zip > PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-COMPATIBILITY-TEST-PROFILES-win-x64.zip.sha256
          )

      - name: Upload V8 alpha33 isolated compatibility test profiles
        uses: actions/upload-artifact@v4
        with:
          name: PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-COMPATIBILITY-TEST-PROFILES-win-x64
          path: |
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-COMPATIBILITY-TEST-PROFILES-win-x64.zip
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-COMPATIBILITY-TEST-PROFILES-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Package two isolated Windows trading profiles
        run: |
          set -euo pipefail
          mkdir -p dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-A
          mkdir -p dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-B

          cp dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.exe \
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-A/PKVault-Trader-A.exe
          cp dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.exe \
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-B/PKVault-Trader-B.exe

          cp -a trade-test/seed-A/. dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-A/
          cp -a trade-test/seed-B/. dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-B/

          cat > dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/TESTING.txt <<'EOF'
          PKVault v8.0.0-alpha33-Uranium-Overlay-Dex Online/VPN Trading + Permanent Dex Registration test
          ===================================
          Trader A starts with:
            Abra, Growlithe, Machop, Gastly, Dratini, Scyther
          Trader B starts with:
            Sandshrew, Poliwag, Cubone, Horsea, Pinsir, Jynx

          Local self-test:
          1. Open Trader-A/PKVault-Trader-A.exe.
          2. Open Trader-B/PKVault-Trader-B.exe.
          3. Optional: open Settings > Trading and change Player name. Trader A/B are pre-seeded as "Trader A" and "Trader B".
          4. Stay on Storage. In one pane choose Trading from the same source selector that contains PKVault and save files.
          5. Leave the opposite pane on PKVault so you can browse its normal box tabs.
          6. Trader A: in the Trading pane click Host Local.
          7. Trader B: choose Trading in one pane, leave localhost:0000 in the address box, and click Connect.
          8. Browse PKVault boxes in the opposite pane and drag up to six Pokemon into the six Trading offer slots.
          9. The Pokemon are only reserved until commit; cancel/unready/disconnect does not delete or move them.
          10. One side may offer zero Pokemon, so gifts and uneven trades are supported.
          11. Click Ready to Trade on both copies.
          12. When both report Trade complete, the normal Storage panes should refresh automatically without Reload all data & saves.
          13. Open Pokedex: received Pokemon should be registered as caught. If you trade one away again, it should stay registered.

          Direct LAN / Radmin / Hamachi:
          - Host chooses Trading in one Storage pane and clicks Host Direct / VPN.
          - PKVault picks a random real port and lists detected IPv4 connection addresses.
          - If a 26.x.x.x address is shown, that is usually the Radmin VPN address; use its full IP:port exactly as displayed.
          - Otherwise copy the VPN IPv4 from Radmin/Hamachi and append the random port shown by PKVault.
          - The partner chooses Trading, pastes IP:port into Connect, and joins.
          - If Windows Firewall asks about PKVault, allow it on the network profile used by the VPN.
          - Builds with incompatible trading protocol versions are rejected with a clear error instead of half-connecting.

          Current test-build scope:
          - Main PKVault vault Pokemon are tradeable, up to 6 per side.
          - Every official Pokemon received through trading is permanently registered as caught in PKVault's central Pokedex.
          - Trading that Pokemon away later does not remove its Pokedex registration.
          - The registration uses the received Pokemon's own context/form/gender/shiny/alpha/language metadata, covering supported games from Gen 1 through ZA.
          - Eggs and glitch species 0 do not create official Pokedex entries.\n          - Settings > Trading > Player name controls the name peers see; it is not derived from the EXE/folder name.
          - Uneven trades and one-way gifts are supported.
          - Loaded-save slots are not yet offered directly.
          - Room-code relay is not yet implemented.
          - Raw direct-IP traffic is not encrypted by PKVault in this test build; use a trusted LAN/VPN such as Radmin/Hamachi for remote testing.
          - Host Direct listens on all IPv4 interfaces and advertises detected non-loopback IPv4 addresses with the randomized port.
          - Direct connection attempts time out after 15 seconds instead of hanging indefinitely.
          EOF

          cp pkvault-src/PKVAULT_GEN1_REBUILD.txt dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/
          sha256sum dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-A/PKVault-Trader-A.exe \
            | tee dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-A/PKVault-Trader-A.sha256
          sha256sum dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-B/PKVault-Trader-B.exe \
            | tee dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/Trader-B/PKVault-Trader-B.sha256

          (cd dist && zip -9 -r PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.zip PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test)
          sha256sum dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.zip \
            | tee dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.sha256
          ls -lah dist
          find dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test -maxdepth 3 -type f -print | sort

      - name: Upload PKVault v8.0.0-alpha33-Uranium-Overlay-Dex online trading dex test
        uses: actions/upload-artifact@v4
        with:
          name: PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64
          path: |
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.zip
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.sha256
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test-win-x64.exe
            dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-Online-Trading-Dex-Test/TESTING.txt
          if-no-files-found: error
          retention-days: 30
