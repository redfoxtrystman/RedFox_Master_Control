          9. The Pokemon are only reserved until commit; cancel/unready/disconnect does not delete or move them.
          10. One side may offer zero Pokemon, so gifts and uneven trades are supported.
          11. Click Ready to Trade on both copies.
          12. When both report Trade complete, the normal Storage panes should refresh automatically without Reload all data & saves.
          13. Open Pokedex: received Pokemon should be registered as caught. If you trade one away again, it should stay registered.

          Direct LAN / Radmin / Hamachi:
          - Host chooses Trading in one Storage pane and clicks Host Direct / VPN.
          - PKVault picks a random real port and lists detected IPv4 connection addresses.
          - If a 26.x.x.x address is shown, that is usually the Radmin VPN address; use its full IP:port exactly as displayed.
          - Otherwise copy the VPN IPv4 from Radmin/Hamachi and append the random port shown by PKVault.
          - The partner chooses Trading, pastes IP:port into Connect, and joins.
          - If Windows Firewall asks about PKVault, allow it on the network profile used by the VPN.
          - Builds with incompatible trading protocol versions are rejected with a clear error instead of half-connecting.

          Current test-build scope:
          - Main PKVault vault Pokemon are tradeable, up to 6 per side.
          - Every official Pokemon received through trading is permanently registered as caught in PKVault's central Pokedex.
          - Trading that Pokemon away later does not remove its Pokedex registration.
          - The registration uses the received Pokemon's own context/form/gender/shiny/alpha/language metadata, covering supported games from Gen 1 through ZA.
          - Eggs and glitch species 0 do not create official Pokedex entries.\n          - Settings > Trading > Player name controls the name peers see; it is not derived from the EXE/folder name.
          - Uneven trades and one-way gifts are supported.
          - Loaded-save slots are not yet offered directly.
          - Room-code relay is not yet implemented.
          - Raw direct-IP traffic is not encrypted by PKVault in this test build; use a trusted LAN/VPN such as Radmin/Hamachi for remote testing.
          - Host Direct listens on all IPv4 interfaces and advertises detected non-loopback IPv4 addresses with the randomized port.
          - Direct connection attempts time out after 15 seconds instead of hanging indefinitely.
