      - name: Package complete v8.0.0-alpha33-Uranium-Overlay-Dex source snapshot
        run: |
          set -euo pipefail
          SOURCE_ROOT="$GITHUB_WORKSPACE/dist/PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-FULL-SOURCE"
          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"

