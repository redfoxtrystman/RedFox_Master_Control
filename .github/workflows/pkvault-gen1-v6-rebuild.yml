name: PKVault V8 Essentials + TMT Compatibility

on:
  push:
    branches:
      - pkvault-v8-romhack-tmt
      - pkvault-v8-uranium-insurgence
    paths:
      - 'pkvault-rebuild/**'
      - '.github/workflows/pkvault-gen1-v6-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Checkout exact PKVault baseline
        run: |
          git clone https://github.com/Chnapy/PKVault.git pkvault-src
          cd pkvault-src
          git checkout 88993b8702a3ec7fc54b67ea1e2dbb1827822cec

      - name: Checkout exact PKHeX 26.08.26
        run: |
          git clone https://github.com/kwsch/PKHeX.git pkhex-src
          cd pkhex-src
          git checkout 74b88906e935e4a52d6d9243b8e373056409c738

      - name: Apply reconstructed v5 fixes plus Party-to-Box fix
        run: |
          python3 pkvault-rebuild/patch_pkvault_gen1.py pkvault-src pkhex-src
          git -C pkvault-src diff --check
          git -C pkhex-src diff --check

      - name: Apply V8 ROM-hack compatibility layer
        run: |
          python3 pkvault-rebuild/v8/patch_pkvault_v8.py pkvault-src pkhex-src
          git -C pkvault-src diff --check
          git -C pkhex-src diff --check

      - name: Package pinned Pokémon Uranium PC icons
        run: |
          set -euo pipefail
          mkdir -p pkvault-src/frontend/public/romhacks/uranium/icons
          curl -fL --retry 3 https://github.com/infinitel8p/PokeDexSprites/archive/ea3cd293eff3ae5dc9af3a97d1c212204f011204.tar.gz -o /tmp/uranium-sprites.tar.gz
          rm -rf /tmp/uranium-sprites
          mkdir -p /tmp/uranium-sprites
          tar -xzf /tmp/uranium-sprites.tar.gz -C /tmp/uranium-sprites --strip-components=1
          cp /tmp/uranium-sprites/Uranium/Sprites/Icon*.gif pkvault-src/frontend/public/romhacks/uranium/icons/
          icon_count="$(find pkvault-src/frontend/public/romhacks/uranium/icons -maxdepth 1 -name 'Icon*.gif' | wc -l)"
          test "$icon_count" -eq 200
          test -f pkvault-src/frontend/public/romhacks/uranium/icons/Icon003.gif
          cat > pkvault-src/frontend/public/romhacks/uranium/ASSET_SOURCE.txt <<'EOF'
          Pokémon Uranium PC/party icons
          Source: infinitel8p/PokeDexSprites
          Commit: ea3cd293eff3ae5dc9af3a97d1c212204f011204
          Paths: Uranium/Sprites/Icon001.gif .. Icon200.gif
          EOF
          echo "PASS: packaged 200 Uranium PC/party icons"

      - name: Package static Pokémon Uranium battle-front sprites
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p pkvault-src/frontend/public/romhacks/uranium/front
          python3 <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from io import BytesIO
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          from PIL import Image

          commit = "c2b4308c214f164487ec9de8c1645fd978b2943e"
          base = f"https://raw.githubusercontent.com/Quickshoters/PokemonGodot/{commit}/Graphics/Battlers"
          out = Path("pkvault-src/frontend/public/romhacks/uranium/front")
          out.mkdir(parents=True, exist_ok=True)

          def download(species_id: int):
              stem = f"{species_id:03d}"
              candidates = [
                  f"{stem}.png",
                  f"{stem}.PNG",
                  f"{stem}_1.png",
                  f"{stem}_1.PNG",
              ]
              data = None
              source = None
              for name in candidates:
                  try:
                      req = Request(f"{base}/{name}", headers={"User-Agent": "PKVault-RedFox-build"})
                      with urlopen(req, timeout=30) as response:
                          data = response.read()
                      source = name
                      break
                  except HTTPError as ex:
                      if ex.code != 404:
                          raise
              if data is None:
                  raise RuntimeError(f"No front battler found for {stem}")

              image = Image.open(BytesIO(data)).convert("RGBA")
              # Uranium uses horizontal animation sheets for some battlers.
              # PKVault intentionally uses only the first 80x80 front frame.
              canvas = Image.new("RGBA", (80, 80), (0, 0, 0, 0))
              crop = image.crop((0, 0, min(80, image.width), min(80, image.height)))
              canvas.paste(crop, (0, 0), crop)
              canvas.save(out / f"{stem}.png", format="PNG", optimize=True)
              return species_id, source, image.size

          with ThreadPoolExecutor(max_workers=16) as pool:
              futures = [pool.submit(download, i) for i in range(1, 201)]
              for future in as_completed(futures):
                  species_id, source, size = future.result()
                  print(f"{species_id:03d}: {source} {size[0]}x{size[1]} -> 80x80 static")

          files = list(out.glob("*.png"))
          if len(files) != 200:
              raise SystemExit(f"Expected 200 static Uranium front sprites, got {len(files)}")
          PY

          test -f pkvault-src/frontend/public/romhacks/uranium/front/003.png
          test -f pkvault-src/frontend/public/romhacks/uranium/front/136.png
          test -f pkvault-src/frontend/public/romhacks/uranium/front/194.png
          test "$(find pkvault-src/frontend/public/romhacks/uranium/front -maxdepth 1 -name '*.png' | wc -l)" -eq 200
          echo "PASS: packaged 200 nonanimated 80x80 Uranium front battle sprites"

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build patched PKHeX.Core
        run: |
          dotnet build pkhex-src/PKHeX.Core/PKHeX.Core.csproj -c Release --nologo
          cp pkhex-src/PKHeX.Core/bin/Release/net10.0/PKHeX.Core.dll pkvault-src/PKVault.Core/PKHeX.Core.dll

      - name: Gen1 serializer smoke test
        run: |
          mkdir -p smoke
          cat > smoke/smoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <JsonSerializerIsReflectionEnabledByDefault>false</JsonSerializerIsReflectionEnabledByDefault>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="PKHeX.Core">
                <HintPath>../pkvault-src/PKVault.Core/PKHeX.Core.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          cat > smoke/Program.cs <<'EOF'
          using PKHeX.Core;

          static void Need(bool value, string message)
          {
              if (!value) throw new Exception(message);
          }

          var normal = new PK1();
          normal.Species = 25;
          normal.Stat_Level = 42;
          normal.EXP = 80000;

          var glitch = new PK1();
          glitch.SpeciesInternal = 0;
          glitch.CatchRate = 45;
          glitch.EXP = 12345;
          glitch.Stat_Level = 20;

          var missingno50 = new PK1();
          missingno50.SpeciesInternal = 0x50;
          missingno50.CatchRate = 45;
          missingno50.EXP = 54321;
          missingno50.Stat_LevelBox = 92;

          var blank = new PK1();

          var normalSingle = PokeList1.WrapSingle(normal);
          var glitchSingle = PokeList1.WrapSingle(glitch);
          var blankSingle = PokeList1.WrapSingle(blank);

          Need(normalSingle[0] == 1 && normalSingle[1] != 0 && normalSingle[1] != 0xFF,
              "normal Pokemon did not serialize as occupied");
          Need(glitchSingle[0] == 1 && glitchSingle[1] == 0,
              "raw-00 glitch was not preserved as occupied");
          Need(blankSingle[0] == 0 && blankSingle[1] == 0xFF,
              "blank PK1 became occupied");
          var missingno50Single = PokeList1.WrapSingle(missingno50);
          Need(PokeList1.IsKnownGen1Glitch(missingno50),
              "raw-50 MissingNo was not recognized as a supported Gen1 glitch");
          Need(missingno50Single[0] == 1 && missingno50Single[1] == 0x50,
              "raw-50 MissingNo was not serialized as occupied");

          var one = normalSingle.Length;
          var singles = new byte[one * 3];
          normalSingle.CopyTo(singles, 0);
          glitchSingle.CopyTo(singles, one);
          blankSingle.CopyTo(singles, one * 2);

          var stringLength = normal.OriginalTrainerTrash.Length;
          var box = new byte[PokeList1.GetListLength(3, false, false)];
          Need(PokeList1.MergeSingles(singles, box, stringLength, 3, false), "box merge failed");
          Need(box[0] == 2, "box count should contain normal + raw00 glitch");
          Need(box[1] == normal.SpeciesInternal, "normal Pokemon header corrupted");
          Need(box[2] == 0, "raw00 header corrupted");
          Need(box[3] == 0xFF && box[4] == 0xFF, "box empty/terminator markers invalid");

          var normalFromBox = PokeList1.ReadFromList(box, stringLength, 3, false, 0);
          var glitchFromBox = PokeList1.ReadFromList(box, stringLength, 3, false, 1);
          Need(normalFromBox.Species == 25, "Party->Box normal Pokemon became '?'");
          Need(glitchFromBox.SpeciesInternal == 0, "raw00 glitch did not round-trip");

          var party = new byte[PokeList1.GetListLength(3, false, true)];
          Need(PokeList1.MergeSingles(singles, party, stringLength, 3, true), "party merge failed");
          Need(party[0] == 2 && party[2] == 0, "party occupancy/raw00 preservation failed");

          Console.WriteLine("PASS: normal, blank, raw00, party and box Gen1 serialization");

          // Regression: a normal Pokemon placed in a Red box and then removed
          // before save must not resurrect as a raw-00 glitch after save/reload.
          var red = new SAV1(LanguageID.English, GameVersion.RB);
          red.SetBoxSlotAtIndex(normal.Clone(), 0, 0, EntityImportSettings.None);
          var blankForClear = red.BlankPKM;
          red.SetBoxSlotAtIndex(blankForClear, 0, 0, EntityImportSettings.None);
          var removedBytes = red.Write().ToArray();
          var redReload = new SAV1(removedBytes, LanguageID.English, GameVersion.RB);
          var resurrected = redReload.GetBoxData(0)
              .OfType<PK1>()
              .Count(PokeList1.IsOccupied);
          Need(resurrected == 0, $"vacated box slot resurrected as {resurrected} occupied Pokemon");

          // A genuine raw-00 glitch must still survive the same save/reload path.
          var glitchSave = new SAV1(LanguageID.English, GameVersion.RB);
          glitchSave.SetBoxSlotAtIndex(glitch.Clone(), 0, 0, EntityImportSettings.None);
          var glitchBytes = glitchSave.Write().ToArray();
          var glitchReload = new SAV1(glitchBytes, LanguageID.English, GameVersion.RB);
          var glitchRoundTrip = (PK1)glitchReload.GetBoxSlotAtIndex(0, 0);
          Need(PokeList1.IsRawZeroGlitch(glitchRoundTrip), "real raw-00 glitch was lost after SAV1 save/reload");

          // Raw-50 MissingNo must also survive box + party save paths.
          var missingSave = new SAV1(LanguageID.English, GameVersion.RB);
          missingSave.SetBoxSlotAtIndex(missingno50.Clone(), 0, 0, EntityImportSettings.None);
          var missingBytes = missingSave.Write().ToArray();
          var missingReload = new SAV1(missingBytes, LanguageID.English, GameVersion.RB);
          var missingRoundTrip = (PK1)missingReload.GetBoxSlotAtIndex(0, 0);
          Need(missingRoundTrip.SpeciesInternal == 0x50, "raw-50 MissingNo was lost after SAV1 box save/reload");

          var missingParty = new SAV1(LanguageID.English, GameVersion.RB);
          missingParty.PartyData = [missingno50.Clone()];
          Need(missingParty.PartyCount == 1, "raw-50 MissingNo was not counted as a party Pokemon");
          Need(((PK1)missingParty.PartyData[0]).SpeciesInternal == 0x50, "raw-50 MissingNo party marker was corrupted");

          // Gen1 inventory regression: SAV1 bag and PC item quantities must
          // survive save/reload, including quantities above the normal 99 cap.
          var itemSave = new SAV1(LanguageID.English, GameVersion.RB);
          var itemBag = itemSave.Inventory;
          var bagPouch = itemBag.GetPouch(InventoryType.Items);
          var pcPouch = itemBag.GetPouch(InventoryType.PCItems);

          bagPouch.Items[0].Index = 1; // Master Ball
          bagPouch.Items[0].Count = 123;
          pcPouch.Items[0].Index = 1;
          pcPouch.Items[0].Count = 77;
          itemBag.CopyTo(itemSave);

          var itemBytes = itemSave.Write().ToArray();
          var itemReload = new SAV1(itemBytes, LanguageID.English, GameVersion.RB);
          var itemReloadBag = itemReload.Inventory;
          var bagReload = itemReloadBag.GetPouch(InventoryType.Items);
          var pcReload = itemReloadBag.GetPouch(InventoryType.PCItems);

          Need(bagReload.Items[0].Index == 1 && bagReload.Items[0].Count == 123,
              $"Gen1 bag Master Ball stack lost: id={bagReload.Items[0].Index} count={bagReload.Items[0].Count}");
          Need(pcReload.Items[0].Index == 1 && pcReload.Items[0].Count == 77,
              $"Gen1 PC Master Ball stack lost: id={pcReload.Items[0].Index} count={pcReload.Items[0].Count}");

          Console.WriteLine("PASS: SAV1 vacated-slot, raw00/raw50 and Gen1 inventory regressions");
          EOF
          dotnet run --project smoke/smoke.csproj -c Release

      - name: Build PKVault Core with patched library
        run: |
          dotnet build pkvault-src/PKVault.Core/PKVault.Core.csproj -c Release --nologo

      - name: Alpha33 Gen1 inventory mapping regression test
        run: |
          set -euo pipefail
          mkdir -p gen1-inventory-map-smoke
          cat > gen1-inventory-map-smoke/gen1-inventory-map-smoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../pkvault-src/PKVault.Core/PKVault.Core.csproj" />
              <Reference Include="PKHeX.Core">
                <HintPath>../pkvault-src/PKVault.Core/PKHeX.Core.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          cat > gen1-inventory-map-smoke/Program.cs <<'EOF'
          using System.Reflection;
          using PKHeX.Core;
          using PKVault.Core;

          static void Need(bool value, string message)
          {
              if (!value) throw new Exception(message);
          }

          var red = new SAV1(LanguageID.English, GameVersion.RB);

          var method = typeof(ItemBankService).GetMethod(
              "GetGenerationOneItemMap",
              BindingFlags.NonPublic | BindingFlags.Static
          );
          Need(method is not null, "Gen1 inventory map helper not found");

          var map = (Dictionary<int, string>)method!.Invoke(null, [red])!;

          Need(map.TryGetValue(1, out var master) && master == "master-ball",
              $"Gen1 item 1 did not map to master-ball: {master ?? "<missing>"}");
          Need(map.TryGetValue(11, out var antidote) && antidote == "antidote",
              $"Gen1 item 11 did not map to antidote: {antidote ?? "<missing>"}");
          Need(map.TryGetValue(40, out var rareCandy) && rareCandy == "rare-candy",
              $"Gen1 item 40 did not map to rare-candy: {rareCandy ?? "<missing>"}");

          var bag = red.Inventory;
          var items = bag.GetPouch(InventoryType.Items);
          var pcItems = bag.GetPouch(InventoryType.PCItems);

          items.Items[0].Index = 11;
          items.Items[0].Count = 5;
          items.Items[1].Index = 1;
          items.Items[1].Count = 175;
          items.Items[2].Index = 42;
          items.Items[2].Count = 124;

          pcItems.Items[0].Index = 234;
          pcItems.Items[0].Count = 1;
          pcItems.Items[1].Index = 3;
          pcItems.Items[1].Count = 13;

          bag.CopyTo(red);

          var bytes = red.Write().ToArray();
          var reload = new SAV1(bytes, LanguageID.English, GameVersion.RB);
          var reloadBag = reload.Inventory;
          var reloadItems = reloadBag.GetPouch(InventoryType.Items);
          var reloadPc = reloadBag.GetPouch(InventoryType.PCItems);

          Need(reloadItems.Items[0].Index == 11 && reloadItems.Items[0].Count == 5,
              "Uploaded-save style first Red bag slot did not survive");
          Need(reloadItems.Items[1].Index == 1 && reloadItems.Items[1].Count == 175,
              "Uploaded-save style Master Ball x175 did not survive");
          Need(reloadItems.Items[2].Index == 42 && reloadItems.Items[2].Count == 124,
              "Uploaded-save style Helix Fossil x124 did not survive");
          Need(reloadPc.Items[0].Index == 234 && reloadPc.Items[0].Count == 1,
              "Uploaded-save style Red PC item did not survive");
          Need(reloadPc.Items[1].Index == 3 && reloadPc.Items[1].Count == 13,
              "Uploaded-save style Red PC stack did not survive");

          Console.WriteLine("PASS: Gen1 SAV1 item map + uploaded-save style bag/PC quantities");

          // alpha33 regression: same-save Red PC -> PC must use the atomic
          // same-pouch helper so the target cannot be erased by a stale write.
          var samePouchMove = typeof(ItemBankService).GetMethod(
              "MoveWithinSamePouch",
              BindingFlags.NonPublic | BindingFlags.Static
          );
          Need(samePouchMove is not null, "alpha33 same-pouch move helper not found");

          var pcMoveSave = new SAV1(LanguageID.English, GameVersion.RB);
          var pcMoveBag = pcMoveSave.Inventory;
          var pcMovePouch = pcMoveBag.GetPouch(InventoryType.PCItems);
          pcMovePouch.Items[0].Index = 1;
          pcMovePouch.Items[0].Count = 77;

          var moved = (int)samePouchMove!.Invoke(
              null,
              [pcMoveBag, pcMovePouch, 0, 1, 77]
          )!;
          Need(moved == 77, $"alpha33 Red PC move moved {moved}, expected 77");

          pcMoveBag.CopyTo(pcMoveSave);
          var pcMoveReload = new SAV1(
              pcMoveSave.Write().ToArray(),
              LanguageID.English,
              GameVersion.RB
          );
          var pcMoveReloadPouch = pcMoveReload.Inventory.GetPouch(InventoryType.PCItems);
          Need(
              pcMoveReloadPouch.Items.Any(x => x.Index == 1 && x.Count == 77),
              "alpha33 Red PC -> PC move deleted the item after save/reload"
          );

          Console.WriteLine("PASS: alpha33 atomic Red PC -> PC item move");
          EOF
          dotnet run --project gen1-inventory-map-smoke/gen1-inventory-map-smoke.csproj -c Release

      - name: Alpha33 skip-legality synchronization regression test
        run: |
          set -euo pipefail
          grep -F 'if (legality.la is not null)' pkvault-src/PKVault.Core/storage/services/PkmConvertService/PkmSharePropertiesService.cs
          grep -F 'SharePropertiesTo_SkipLegalityChecks_DoesNotDereferenceMissingAnalysis' pkvault-src/PKVault.Core.Tests/storage/services/PkmConvertService/PkmSharePropertiesServiceTests.cs
          dotnet test pkvault-src/PKVault.Core.Tests/PKVault.Core.Tests.csproj -c Release --nologo --no-restore --filter "FullyQualifiedName~PkmSharePropertiesServiceTests"

      - name: V8 Essentials native desktop rxdata location smoke test
        run: |
          set -euo pipefail
          grep -F 'var canUploadSaves = !isDesktop;' pkvault-src/PKVault.Core/settings/services/SettingsService.cs
          ! grep -F 'var canUploadSaves = true;' pkvault-src/PKVault.Core/settings/services/SettingsService.cs
          grep -F 'body = body.TrimEnd' pkvault-src/PKVault.Core/db/loader/save/SavesLoadersService.cs
          grep -F '"/**/*"' pkvault-src/PKVault.Core/db/loader/save/SavesLoadersService.cs
          grep -F 'Path.GetExtension(path).Equals(".rxdata", StringComparison.OrdinalIgnoreCase)' pkvault-src/PKVault.Core/db/loader/save/SavesLoadersService.cs
          grep -F 'onAddCommitted={commitAddedSaveLocations}' pkvault-src/frontend/src/settings/main/settings-main-right.tsx
          grep -F 'await onAddCommitted?.(nextValue);' pkvault-src/frontend/src/settings/globs-input/globs-input-list.tsx
          grep -F 'romHackLocalSpeciesId={romHackLocalSpeciesId}' pkvault-src/frontend/src/storage/item/save/storage-save-item.tsx
          test "$(find pkvault-src/frontend/public/romhacks/uranium/icons -maxdepth 1 -name 'Icon*.gif' | wc -l)" -eq 200
          test -f pkvault-src/frontend/public/romhacks/uranium/icons/Icon003.gif
          grep -F 'party={!romHackProfile && savePkm.party >= 0 ? savePkm.party : undefined}' pkvault-src/frontend/src/storage/item/save/storage-save-item.tsx
          grep -F 'getUraniumFrontSpritePath(localSpeciesId)' pkvault-src/frontend/src/img/species-img.tsx
          grep -F '<UraniumPokedexSection />' pkvault-src/frontend/src/pokedex/list/pokedex-list.tsx
          grep -F 'UraniumPokedexDetails' pkvault-src/frontend/src/pokedex/details/pokedex-main-wrapper-details.tsx
          grep -F 'EssentialsLegacySaveFile essentials => new DexEssentialsService(essentials)' pkvault-src/PKVault.Core/dex/services/DexService.cs
          test "$(find pkvault-src/frontend/public/romhacks/uranium/front -maxdepth 1 -name '*.png' | wc -l)" -eq 200
          echo "PASS: Windows keeps native Add saves location UI, rxdata directories expand to files, and newly added save locations auto-apply"

      - name: V8 Essentials Uranium and Insurgence parser smoke test
        run: |
          set -euo pipefail
          mkdir -p "essentials-smoke/fixtures/Pokemon Uranium" "essentials-smoke/fixtures/Pokemon Insurgence"

          cat > essentials-smoke/essentials-smoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../pkvault-src/PKVault.Core/PKVault.Core.csproj" />
              <Reference Include="PKHeX.Core">
                <HintPath>../pkvault-src/PKVault.Core/PKHeX.Core.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF

          cat > essentials-smoke/Program.cs <<'EOF'
          using System.Text.Json;
          using PKHeX.Core;
          using PKVault.Core;

          AppContext.SetSwitch("System.Text.Json.JsonSerializer.IsReflectionEnabledByDefault", false);

          static void Need(bool value, string message)
          {
              if (!value) throw new Exception(message);
          }

          static EssentialsLegacySaveData Load(string path)
          {
              var bytes = File.ReadAllBytes(path);
              Need(EssentialsLegacySaveReader.TryRead(bytes, path, out var save, out var error),
                  $"Failed to parse {path}: {error}");
              return save!;
          }

          static byte[] Slice(byte[] bytes, RubyMarshalDocument doc) =>
              bytes.AsSpan(doc.Offset, doc.Length).ToArray();

          static void NeedUntouchedStreams(byte[] beforeBytes, EssentialsLegacySaveData before, byte[] afterBytes, EssentialsLegacySaveData after)
          {
              Need(before.Documents.Count == after.Documents.Count, "Marshal stream count changed");
              for (var i = 0; i < before.Documents.Count; i++)
              {
                  var root = before.Documents[i].Root as RubyObject;
                  if (root?.ClassName is "PokeBattle_Trainer" or "PokemonStorage")
                      continue;
                  Need(Slice(beforeBytes, before.Documents[i]).SequenceEqual(Slice(afterBytes, after.Documents[i])),
                      $"Unrelated Marshal stream {i} changed");
              }
          }

          var uraniumPath = "essentials-smoke/fixtures/Pokemon Uranium/Uranium.rxdata";
          var uraniumBytes = File.ReadAllBytes(uraniumPath);
          var uranium = Load(uraniumPath);
          Need(uranium.Game == EssentialsGameKind.Uranium, "Uranium profile detection failed");
          Need(uranium.Documents.Count == 15, $"Expected 15 Uranium Marshal streams, got {uranium.Documents.Count}");
          Need(uranium.Party.Count == 6, $"Expected 6 Uranium party Pokemon, got {uranium.Party.Count}");
          Need(uranium.PokemonCount == 215, $"Expected 215 Uranium Pokemon, got {uranium.PokemonCount}");
          Need(uranium.Party[0].ProfileId == "pokemon-uranium", "Uranium PKM profile ID missing");
          Need(uranium.Party[0].LocalSpeciesId == 170, $"Unexpected Uranium first party species {uranium.Party[0].LocalSpeciesId}");
          Need(uranium.Party[0].SourceRubyMarshal.Length > 0 && !uranium.Party[0].ReadOnlySource,
              "Uranium writable source template missing");

          var uraniumFacade = new EssentialsLegacySaveFile(uranium);
          uraniumFacade.Metadata.SetExtraInfo(uraniumPath);
          var uraniumWrapper = new SaveWrapper(uraniumFacade);
          Need(uraniumWrapper.GetPartyData().Count == 6, "Uranium SaveWrapper lost party data");
          Need(uraniumWrapper.GetBoxNames().Count == 35, "Uranium SaveWrapper lost box names");
          Need(uraniumWrapper.GetAllPKM().Count == 215, "Uranium SaveWrapper lost Pokemon");
          var uraniumInfo = SaveInfosDTO.FromSave(uraniumWrapper, null, File.GetLastWriteTime(uraniumPath), []);
          Need(uraniumInfo.RomHackProfile == "pokemon-uranium", "Uranium SaveInfos profile missing");
          Need(uraniumInfo.TrainerName == uranium.TrainerName, "Uranium SaveInfos trainer mismatch");
          Need(uraniumFacade.PartyCount == 6, "Uranium facade lost party count");
          Need(uraniumFacade.BoxCount == 35, $"Expected 35 Uranium boxes, got {uraniumFacade.BoxCount}");
          Need(!uraniumFacade.GetBoxSlotFlags(0).HasFlag(StorageSlotSource.Locked), "Uranium box slot stayed write-locked");
          Need(!uraniumFacade.GetBoxSlotFlags(-uraniumFacade.BoxSlotCount).HasFlag(StorageSlotSource.Locked), "Uranium party slot stayed write-locked");
          Need(((PKEssentials)uraniumFacade.PartyData[0]).ProfileId == "pokemon-uranium", "Uranium facade lost profile-local PKM identity");
          Need(uraniumFacade.Write().ToArray().SequenceEqual(uranium.OriginalBytes), "Clean Uranium facade changed bytes before a write");

          Need(!JsonSerializer.IsReflectionEnabledByDefault,
              "Essentials smoke test must run with reflection JSON disabled");
          var reflectionFreeClone = (PKEssentials)uranium.Party[0].Clone();
          Need(reflectionFreeClone.ProfileId == "pokemon-uranium"
              && reflectionFreeClone.LocalSpeciesId == uranium.Party[0].LocalSpeciesId,
              "PKEssentials reflection-disabled JSON clone failed");

          var uraniumRoundTrip = PKEssentials.Deserialize(PKEssentials.Serialize(uranium.Party[0]));
          Need(uraniumRoundTrip.ProfileId == uranium.Party[0].ProfileId, "Uranium PKM profile lost on serialize");
          Need(uraniumRoundTrip.LocalSpeciesId == uranium.Party[0].LocalSpeciesId, "Uranium local species lost on serialize");
          Need(uraniumRoundTrip.PID == uranium.Party[0].PID, "Uranium PID lost on serialize");
          Need(uraniumRoundTrip.SourceRubyMarshal.SequenceEqual(uranium.Party[0].SourceRubyMarshal), "Uranium Ruby template lost on serialize");

          var uraniumParty0 = (PKEssentials)uraniumFacade.GetPartySlotAtIndex(0);
          uraniumFacade.SetBoxSlotAtIndex(uraniumParty0, 0, 0, EntityImportSettings.None);
          var uraniumWritten = uraniumFacade.Write().ToArray();
          Need(!uraniumWritten.SequenceEqual(uraniumBytes), "Uranium write produced no change");
          Need(EssentialsLegacySaveReader.TryRead(uraniumWritten, uraniumPath, out var uraniumReload, out var uraniumWriteError),
              $"Uranium write did not reparse: {uraniumWriteError}");
          Need(uraniumReload!.Boxes[0].Pokemon[0]?.PID == uraniumParty0.PID, "Uranium box write did not persist");
          NeedUntouchedStreams(uraniumBytes, uranium, uraniumWritten, uraniumReload);

          var insurgencePath = "essentials-smoke/fixtures/Pokemon Insurgence/Game.rxdata";
          var insurgenceBytes = File.ReadAllBytes(insurgencePath);
          var insurgence = Load(insurgencePath);
          Need(insurgence.Game == EssentialsGameKind.Insurgence, "Insurgence profile detection failed");
          Need(insurgence.Documents.Count == 15, $"Expected 15 Insurgence Marshal streams, got {insurgence.Documents.Count}");
          Need(insurgence.Party.Count == 4, $"Expected 4 Insurgence party Pokemon, got {insurgence.Party.Count}");
          Need(insurgence.PokemonCount == 4, $"Expected 4 Insurgence Pokemon, got {insurgence.PokemonCount}");
          Need(insurgence.Party[0].ProfileId == "pokemon-insurgence", "Insurgence PKM profile ID missing");
          Need(insurgence.Party[0].LocalSpeciesId == 731, $"Unexpected Insurgence first party species {insurgence.Party[0].LocalSpeciesId}");
          Need(insurgence.Party[0].SourceRubyMarshal.Length > 0 && !insurgence.Party[0].ReadOnlySource,
              "Insurgence writable source template missing");

          var insurgenceFacade = new EssentialsLegacySaveFile(insurgence);
          insurgenceFacade.Metadata.SetExtraInfo(insurgencePath);
          var insurgenceWrapper = new SaveWrapper(insurgenceFacade);
          Need(insurgenceWrapper.GetPartyData().Count == 4, "Insurgence SaveWrapper lost party data");
          Need(insurgenceWrapper.GetBoxNames().Count == 24, "Insurgence SaveWrapper lost box names");
          Need(insurgenceWrapper.GetAllPKM().Count == 4, "Insurgence SaveWrapper lost Pokemon");
          var insurgenceInfo = SaveInfosDTO.FromSave(insurgenceWrapper, null, File.GetLastWriteTime(insurgencePath), []);
          Need(insurgenceInfo.RomHackProfile == "pokemon-insurgence", "Insurgence SaveInfos profile missing");
          Need(insurgenceFacade.PartyCount == 4, "Insurgence facade lost party count");
          Need(insurgenceFacade.BoxCount == 24, $"Expected 24 Insurgence boxes, got {insurgenceFacade.BoxCount}");
          Need(!insurgenceFacade.GetBoxSlotFlags(0).HasFlag(StorageSlotSource.Locked), "Insurgence box slot stayed write-locked");
          Need(insurgenceFacade.Write().ToArray().SequenceEqual(insurgence.OriginalBytes), "Clean Insurgence facade changed bytes before a write");

          var insurgenceParty0 = (PKEssentials)insurgenceFacade.GetPartySlotAtIndex(0);
          insurgenceFacade.SetBoxSlotAtIndex(insurgenceParty0, 0, 0, EntityImportSettings.None);
          var insurgenceWritten = insurgenceFacade.Write().ToArray();
          Need(EssentialsLegacySaveReader.TryRead(insurgenceWritten, insurgencePath, out var insurgenceReload, out var insurgenceWriteError),
              $"Insurgence write did not reparse: {insurgenceWriteError}");
          Need(insurgenceReload!.Boxes[0].Pokemon[0]?.PID == insurgenceParty0.PID, "Insurgence box write did not persist");
          NeedUntouchedStreams(insurgenceBytes, insurgence, insurgenceWritten, insurgenceReload);

          // Regression modeled after a very early Uranium save: one Raptorch
          // in party, empty boxes, while retaining all 35 PC boxes.
          var earlyFacade = new EssentialsLegacySaveFile(uranium);
          var earlyMon = (PKEssentials)earlyFacade.GetPartySlotAtIndex(0);
          earlyMon.LocalSpeciesId = 3;
          earlyMon.Species = 3;
          earlyMon.SpeciesName = "Raptorch";
          for (var i = 0; i < 6; i++)
              earlyFacade.SetPartySlotAtIndex(i == 0 ? earlyMon : earlyFacade.BlankPKM, i, EntityImportSettings.None);
          for (var box = 0; box < earlyFacade.BoxCount; box++)
              for (var slot = 0; slot < earlyFacade.BoxSlotCount; slot++)
                  earlyFacade.SetBoxSlotAtIndex(earlyFacade.BlankPKM, box, slot, EntityImportSettings.None);
          var earlyBytes = earlyFacade.Write().ToArray();
          Need(EssentialsLegacySaveReader.TryRead(earlyBytes, "Pokemon Uranium/Uranium.rxdata", out var earlyReload, out var earlyError),
              $"Early Uranium regression did not reparse: {earlyError}");
          Need(earlyReload!.Party.Count == 1, $"Early Uranium expected 1 party Pokemon, got {earlyReload.Party.Count}");
          Need(earlyReload.Party[0].LocalSpeciesId == 3, "Early Uranium Raptorch local species was not preserved");
          Need(earlyReload.Boxes.Count == 35, "Early Uranium box structure was lost");
          var earlySave = new EssentialsLegacySaveFile(earlyReload);
          earlySave.Metadata.SetExtraInfo("Pokemon Uranium/Uranium.rxdata");
          var earlyWrapper = new SaveWrapper(earlySave);
          var earlyInfo = SaveInfosDTO.FromSave(earlyWrapper, null, DateTime.UtcNow, []);
          Need(earlyInfo.PartyCount == 1 && earlyInfo.BoxCount == 35, "Early Uranium SaveInfos failed");

          // Exercise the same DTO layer the Storage/Saves UI consumes.
          var earlyImmutable = earlyWrapper.GetPartyData().Single();
          var earlyDto = new PkmSaveDTO(
              SettingsLanguage: "en",
              Pkm: earlyImmutable,
              BoxId: (int)BoxType.Party,
              BoxSlot: 0,
              IsDuplicate: false,
              Save: earlyWrapper,
              Evolves: new Dictionary<ushort, StaticEvolve>()
          );
          Need(earlyDto.Generation == 3, $"Essentials PKM must report generation 3, got {earlyDto.Generation}");
          Need(earlyDto.Version == GameVersion.E, $"Essentials PKM version must be Emerald-compatible, got {earlyDto.Version}");
          Need(earlyDto.Context == EntityContext.Gen3, $"Essentials context must be Gen3, got {earlyDto.Context}");
          Need(earlyDto.RomHackProfile == "pokemon-uranium", "Early Uranium storage DTO lost profile");
          Need(earlyDto.RomHackSpeciesName == "Raptorch", $"Early Uranium storage DTO lost species name: {earlyDto.RomHackSpeciesName}");
          Need(earlyDto.CanMoveToSave, "Writable early Uranium PKM was incorrectly disabled");
          Need(earlyDto.CanMoveToMain, "Early Uranium party Pokemon must be draggable to the central vault");
          Need(UraniumProfileGenerated.All.Count == 200, $"Uranium registry must contain 200 species, got {UraniumProfileGenerated.All.Count}");
          Need(UraniumProfileGenerated.OfficialSpeciesCount == 34, "Uranium official reuse count changed");
          Need(UraniumProfileGenerated.AddedSpeciesCount == 166, "Uranium-added species count changed");
          Need(UraniumProfileGenerated.TryGetOfficialNationalDexId(136, 0, out var glaceonDex) && glaceonDex == 471,
              "Uranium Glaceon must collapse to National Dex #471");
          Need(!UraniumProfileGenerated.TryGetOfficialNationalDexId(194, 0, out _),
              "Krakanao must remain Uranium-local");
          var uraniumGlaceon = new PKEssentials(earlyReload.Party[0].ToPayload() with {
              SpeciesName = "Glaceon",
              TypeNames = ["Ice"],
              LocalSpeciesId = 136,
              LocalFormId = 0,
              OfficialNationalDexId = 471,
              Nickname = "Glaceon",
          });
          Need(uraniumGlaceon.Species == 471 && uraniumGlaceon.LocalSpeciesId == 136,
              "Uranium Glaceon presentation/local IDs are not separated");
          Need(UraniumProfileGenerated.TryGet(3, out var raptorchEntry) && raptorchEntry.Name == "Raptorch",
              "Uranium registry lost Raptorch #3");
          Need(raptorchEntry.Types.SequenceEqual(["Fire", "Ground"]), "Raptorch Uranium types mismatch");
          Need(UraniumProfileGenerated.TryGet(200, out var zephyEntry) && zephyEntry.Name == "Zephy",
              "Uranium registry lost species #200");


          // Insurgence official/custom support regression.
          Need(InsurgenceProfileGenerated.IsOfficialSpecies(1)
              && InsurgenceProfileGenerated.IsOfficialSpecies(721)
              && !InsurgenceProfileGenerated.IsOfficialSpecies(722),
              "Insurgence official species range must be 1..721");
          Need(InsurgenceProfileGenerated.TryGetCustom(722, out var insMissingNo)
              && insMissingNo.Name == "MISSINGNO",
              "Insurgence MISSINGNO #722 missing");
          Need(!InsurgenceProfileGenerated.IsSupportedLocalSpecies(723)
              && !InsurgenceProfileGenerated.IsSupportedLocalSpecies(726),
              "Insurgence reserved gap 723..726 must stay unsupported");
          Need(InsurgenceProfileGenerated.TryGetCustom(731, out var deltaCharmeleon)
              && deltaCharmeleon.Name == "Delta Charmeleon",
              "Insurgence Delta Charmeleon #731 mapping missing");
          Need(InsurgenceProfileGenerated.TryGetCustom(925, out var ufi) && ufi.Name == "UFI",
              "Insurgence UFI #925 mapping missing");

          var insFacadeForImport = new EssentialsLegacySaveFile(insurgence);
          insFacadeForImport.Metadata.SetExtraInfo(insurgencePath);
          var officialPikachu = new PK6
          {
              Species = 25,
              Nickname = "PIKACHU",
              Stat_Level = 25,
              EXP = 15625,
              TID16 = 1234,
              SID16 = 5678,
              PID = 0x12345678,
              Move1 = (ushort)Move.ThunderShock,
              Move2 = (ushort)Move.QuickAttack,
              Ball = (byte)Ball.Poke,
          };
          var importedPikachu = EssentialsInterop.ImportTo(insFacadeForImport, new ImmutablePKM(officialPikachu));
          Need(importedPikachu.GetMutablePkm() is PKEssentials importedEss
              && importedEss.ProfileId == "pokemon-insurgence"
              && importedEss.LocalSpeciesId == 25
              && importedEss.SpeciesName == "Pikachu",
              "Insurgence official import support regression");

          var raw50 = new PK1
          {
              SpeciesInternal = 0x50,
              Stat_Level = 20,
              EXP = 8000,
              CatchRate = 35,
              Move1 = (ushort)Move.WaterGun,
              Move2 = (ushort)Move.SkyAttack,
          };
          var importedMissingNo = EssentialsInterop.ImportTo(insFacadeForImport, new ImmutablePKM(raw50));
          Need(importedMissingNo.GetMutablePkm() is PKEssentials missingEss
              && missingEss.LocalSpeciesId == 722
              && missingEss.SpeciesName == "MISSINGNO",
              "Gen1 raw-50 MISSINGNO -> Insurgence #722 mapping failed");

          var modernUnsupported = new PK9 { Species = 906 };
          var unsupportedBlocked = false;
          try { _ = EssentialsInterop.ImportTo(insFacadeForImport, new ImmutablePKM(modernUnsupported)); }
          catch (InvalidOperationException) { unsupportedBlocked = true; }
          Need(unsupportedBlocked, "Gen7+ species not present in Insurgence must be blocked");

          // Deterministic random Uranium stress save: one party Raptorch plus
          // sixty unique Uranium species across the first two PC boxes.
          var randomUranium = new EssentialsLegacySaveFile(earlyReload);
          randomUranium.Metadata.SetExtraInfo("Uranium-Random-Test/Uranium.rxdata");
          var templateMon = earlyReload.Party[0];
          var random = new Random(0x55414E);
          var ids = Enumerable.Range(1, UraniumProfileGenerated.SpeciesCount)
              .OrderBy(_ => random.Next())
              .Take(Math.Min(60, randomUranium.BoxSlotCount * 2))
              .ToArray();
          var randomList = new List<string>();
          for (var i = 0; i < ids.Length; i++)
          {
              var id = ids[i];
              Need(UraniumProfileGenerated.TryGet(id, out var entry), $"Missing Uranium random entry {id}");
              var payload = templateMon.ToPayload() with
              {
                  SpeciesName = entry.Name,
                  TypeNames = entry.Types,
                  LocalSpeciesId = id,
                  LocalFormId = 0,
                  OfficialNationalDexId = entry.OfficialNationalDexId,
                  Nickname = entry.Name,
                  BaseStats = entry.Stats,
                  Level = (byte)random.Next(5, 81),
                  SourceContainer = "random-test",
                  SourceSlot = i,
                  SourceFingerprint = $"random-test-{i}-{id}",
                  ReadOnlySource = false,
              };
              var mon = new PKEssentials(payload);
              var box = i / randomUranium.BoxSlotCount;
              var slot = i % randomUranium.BoxSlotCount;
              randomUranium.SetBoxSlotAtIndex(mon, box, slot, EntityImportSettings.None);
              randomList.Add($"{box + 1}:{slot + 1}  #{id:000} {entry.Name}");
          }
          var randomBytes = randomUranium.Write().ToArray();
          Directory.CreateDirectory("uranium-random-test");
          File.WriteAllBytes("uranium-random-test/Uranium.rxdata", randomBytes);
          File.WriteAllLines("uranium-random-test/RANDOM_URANIUM_POKEMON.txt", randomList);
          Need(EssentialsLegacySaveReader.TryRead(randomBytes, "Uranium-Random-Test/Uranium.rxdata", out var randomReload, out var randomError),
              $"Random Uranium test save failed to reparse: {randomError}");
          Need(randomReload!.Boxes.Take(2).Sum(b => b.Pokemon.Count(p => p != null)) == ids.Length,
              "Random Uranium stress save lost seeded Pokémon");
          _ = earlyDto.Ball;
          _ = earlyDto.Types;
          _ = earlyDto.Level;
          _ = earlyDto.ExpToLevelUp;
          _ = earlyDto.LevelUpPercent;
          _ = earlyDto.IVs;
          _ = earlyDto.EVs;
          _ = earlyDto.Stats;
          _ = earlyDto.BaseStats;
          _ = earlyDto.Moves;
          _ = earlyDto.OriginMetLocation;
          _ = earlyDto.Ribbons;

          var crossProfileBlocked = false;
          try
          {
              uraniumFacade.SetBoxSlotAtIndex(insurgenceParty0, 0, 1, EntityImportSettings.None);
          }
          catch (InvalidOperationException)
          {
              crossProfileBlocked = true;
          }
          Need(crossProfileBlocked, "Cross-profile Insurgence -> Uranium write was not blocked");

          // Most important collision regression: Essentials-local species 1 is
          // allowed to remain profile-local rather than being treated as Bulbasaur.
          var orchynx = new PKEssentials(new EssentialsPkmPayload {
              ProfileId = "pokemon-uranium",
              SpeciesName = "Orchynx",
              LocalSpeciesId = 1,
              LocalFormId = 0,
              Level = 5,
              TypeNames = ["Grass", "Steel"],
              BaseStats = [50,55,55,50,70,70],
          });
          Need(orchynx.Species == 1 && orchynx.LocalSpeciesId == 1 && orchynx.SpeciesName == "Orchynx",
              "Profile-local Uranium species 1 was aliased incorrectly");

          Console.WriteLine("PASS: Uranium + Insurgence Ruby Marshal read/write, untouched-stream preservation, and profile isolation");
          EOF

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/AlphaKyogre/pokemon-uranium/master/Uranium.rxdata \
            -o "essentials-smoke/fixtures/Pokemon Uranium/Uranium.rxdata"

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/ShockingZebstrika/pokemon-insurgence/master/Game.rxdata \
            -o "essentials-smoke/fixtures/Pokemon Insurgence/Game.rxdata"

          dotnet run --project essentials-smoke/essentials-smoke.csproj -c Release
          test -s uranium-random-test/Uranium.rxdata
          test "$(wc -l < uranium-random-test/RANDOM_URANIUM_POKEMON.txt)" -eq 60

      - name: V8 Too Many Types compatibility smoke test
        run: |
          mkdir -p tmt-smoke
          cat > tmt-smoke/tmt-smoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../pkvault-src/PKVault.Core/PKVault.Core.csproj" />
              <Reference Include="PKHeX.Core">
                <HintPath>../pkvault-src/PKVault.Core/PKHeX.Core.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          cat > tmt-smoke/Program.cs <<'EOF'
          using PKHeX.Core;
          using PKVault.Core;

          static void Need(bool value, string message)
          {
              if (!value) throw new Exception(message);
          }

          var braixen = new PK3 { DirectSpeciesIDs = true };
          braixen.SpeciesInternal = 654;
          braixen.RefreshChecksum();
          Need(braixen.Species == 654, "raw 654 did not resolve to Braixen");
          Need(braixen.PersonalInfo.HP > 0, "expanded Braixen personal data fallback failed");
          Need(braixen.Clone().DirectSpeciesIDs, "PK3 clone lost direct-species mode");

          var ralts = new PK3 { DirectSpeciesIDs = true };
          ralts.SpeciesInternal = 280;
          Need(ralts.Species == 280, "TMT raw 280 did not resolve directly to Ralts");

          Need(Gen3DirectSpecies.TryGetRaw(77, 1, out var gPonyta) && gPonyta == 975,
              "Galarian Ponyta raw form constant mismatch");
          Need(Gen3DirectSpecies.TryGetRaw(745, 1, out var lycanrocN) && lycanrocN == 1173,
              "Lycanroc Midnight raw form constant mismatch");
          Need(Gen3DirectSpecies.TryGetRaw(746, 1, out var wishiwashiSchool) && wishiwashiSchool == 1175,
              "Wishiwashi School raw form constant mismatch");

          Need(TooManyTypesProfileGenerated.Supports(654, 0), "TMT roster missing Braixen");
          Need(TooManyTypesProfileGenerated.Supports(728, 0), "TMT roster missing Popplio");
          Need(!TooManyTypesProfileGenerated.Supports(722, 0), "Rowlet must not be accepted by TMT v1.6 roster");

          var wrappedBraixen = new ImmutablePKM(braixen);
          Need(TooManyTypesCompat.GetStorageExtension(wrappedBraixen) == "tmt3",
              "TMT storage extension was not preserved");
          var types = TooManyTypesCompat.GetTypes(wrappedBraixen);
          Need(types is ["Fire", "Magic", "Furry"], "Braixen TMT type metadata mismatch");

          var rawSave = new byte[SaveUtil.SIZE_G3RAW];
          for (var group = 0; group < 2; group++)
          {
              for (short sector = 0; sector < 14; sector++)
              {
                  var footer = ((group * 14) + sector) * 0x1000 + 0xFF4;
                  System.Buffers.Binary.BinaryPrimitives.WriteInt16LittleEndian(rawSave.AsSpan(footer, 2), sector);
              }
          }
          var tmtSave = new SAV3E(rawSave);
          Need(TooManyTypesCompat.ConfigureSave(tmtSave, "TooManyTypes_PUBLIC_v1.6.sav"),
              "TMT filename fingerprint did not activate profile");
          Need(tmtSave.DirectSpeciesIDs, "TMT save did not enter direct-species mode");
          Need(((SAV3E)tmtSave.Clone()).DirectSpeciesIDs, "SAV3E clone lost direct-species mode");

          // Regression for alpha2: stock Emerald uses an internal Gen3 species
          // order above National Dex #251. Blaziken #257 is raw 282 (Gardevoir
          // nationally), while Chimecho #358 is raw 411. Neither may cause a
          // stock Emerald save to be promoted into TMT direct-species mode.
          var vanillaBlaziken = new PK3 { Species = 257, CurrentLevel = 36 };
          Need(vanillaBlaziken.SpeciesInternal == 282,
              $"Expected vanilla Blaziken internal species 282, got {vanillaBlaziken.SpeciesInternal}.");
          var vanillaChimecho = new PK3 { Species = 358, CurrentLevel = 40 };
          Need(vanillaChimecho.SpeciesInternal == 411,
              $"Expected vanilla Chimecho internal species 411, got {vanillaChimecho.SpeciesInternal}.");
          var vanillaEmerald = new SAV3E();
          vanillaEmerald.PartyData = [vanillaBlaziken, vanillaChimecho];
          Need(!TooManyTypesCompat.ConfigureSave(vanillaEmerald, "Pokemon Emerald.sav"),
              "Stock Emerald was falsely detected as Too Many Types.");
          Need(!vanillaEmerald.DirectSpeciesIDs,
              "Stock Emerald entered direct-species mode.");
          Need(((PK3)vanillaEmerald.PartyData[0]).Species == 257,
              "Stock Emerald Blaziken was reinterpreted as another species.");

          var popplio7 = new PK7 { Species = 728 };
          var tmtPopplio = new PK3();
          TooManyTypesCompat.ApplyTmtIdentity(tmtPopplio, new ImmutablePKM(popplio7));
          Need(tmtPopplio.DirectSpeciesIDs && tmtPopplio.SpeciesInternal == 728 && tmtPopplio.Species == 728,
              "later-generation Popplio identity did not map into TMT");

          var directRalts = new PK3 { DirectSpeciesIDs = true };
          directRalts.SpeciesInternal = 280;
          directRalts.Move1 = 930;
          directRalts.RefreshChecksum();
          var vanilla = TooManyTypesCompat.ConvertDirectToVanilla(directRalts, new SAV3E());
          Need(!vanilla.DirectSpeciesIDs && vanilla.Species == 280,
              "TMT Ralts did not remap back to vanilla Gen3");
          Need(vanilla.Move1 == 0, "TMT custom move leaked into vanilla Gen3");
          Need(vanilla.SpeciesInternal != 280,
              "TMT direct raw species id was not remapped to vanilla Gen3 internal numbering");

          // TMT is an ownership source for the normal National Dex only.
          // The dex adapter must never leak TMT-specific presentation/types.
          var dexSave = new SAV3E { DirectSpeciesIDs = true, TID16 = 1234, SID16 = 5678 };
          var tmtDex = new DexTmtService(dexSave);
          var dex = new Dictionary<ushort, Dictionary<uint, DexItemDTO>>();
          await tmtDex.UpdateDexWithSave(dex, new StaticSpeciesData(), null);
          Need(dex.ContainsKey(654), "TMT ownership source did not include Braixen");
          var braixenDex = dex[654].Values.Single();
          Need(braixenDex.Forms.Count > 0, "TMT-owned Braixen dex entry has no forms");

          var officialBraixen = EntityBlank.GetIdealBlank(654, 0);
          officialBraixen.Species = 654;
          officialBraixen.Form = 0;
          var officialBraixenTypes = DexGenService.GetTypes(officialBraixen.Generation, officialBraixen.PersonalInfo);
          Need(braixenDex.Forms.All(f => f.Types.SequenceEqual(officialBraixenTypes)),
              "TMT-owned Braixen leaked ROM-hack typing into the National Dex");
          Need(braixenDex.Forms.All(f => f.Context == officialBraixen.Context),
              "TMT-owned Braixen did not use an official presentation context");

          var officialRalts = EntityBlank.GetIdealBlank(280, 0);
          officialRalts.Species = 280;
          officialRalts.Form = 0;
          var officialRaltsTypes = DexGenService.GetTypes(officialRalts.Generation, officialRalts.PersonalInfo);
          var raltsDex = dex[280].Values.Single();
          Need(raltsDex.Forms.All(f => f.Types.SequenceEqual(officialRaltsTypes)),
              "TMT-owned Ralts leaked Space/Fairy presentation into the National Dex");

          Console.WriteLine("PASS: PKVault V8 TMT direct species, forms, roster, storage types, canonical dex ownership, clone and vanilla downgrade");
          EOF
          dotnet run --project tmt-smoke/tmt-smoke.csproj -c Release

      - name: Seed 55-Pokemon mixed-format TMT compatibility profile
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          HARNESS="$ROOT/pkvault-rebuild/trading-smoke/trading-smoke.csproj"
          TMT_PROFILE="$ROOT/tmt-type-test-profile"
          rm -rf "$TMT_PROFILE"
          mkdir -p "$TMT_PROFILE"

          PKVAULT_PATH="$TMT_PROFILE" PKVAULT_TRADE_PROFILE="TMT-Type-Test" \
            dotnet run --project "$HARNESS" -c Release -- seed-tmt

          test -f "$TMT_PROFILE/db/pkvault.db"
          test -f "$TMT_PROFILE/config/pkvault.json"

          TMT_COUNT=$(find "$TMT_PROFILE/storage" -type f -name '*.tmt3' | wc -l)
          PK3_COUNT=$(find "$TMT_PROFILE/storage" -type f -name '*.pk3' | wc -l)
          PK1_COUNT=$(find "$TMT_PROFILE/storage" -type f -name '*.pk1' | wc -l)
