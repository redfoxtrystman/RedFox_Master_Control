          cp -a "$SEED_B" "$DIRECT_B"
          rm -f "$DIRECT_ADDR"

          PKVAULT_PATH="$DIRECT_A"             dotnet run --no-build --project "$HARNESS" -c Release -- direct-host "$DIRECT_ADDR" > "$ROOT/trade-direct-host.log" 2>&1 &
          DIRECT_HOST_PID=$!

          sleep 2

          PKVAULT_PATH="$DIRECT_B"             dotnet run --no-build --project "$HARNESS" -c Release -- direct-join "$DIRECT_ADDR" > "$ROOT/trade-direct-join.log" 2>&1 &
          DIRECT_JOIN_PID=$!

          set +e
          wait "$DIRECT_HOST_PID"; DIRECT_HOST_RC=$?
          wait "$DIRECT_JOIN_PID"; DIRECT_JOIN_RC=$?
          set -e

          echo "===== DIRECT HOST LOG ====="
          cat "$ROOT/trade-direct-host.log"
          echo "===== DIRECT JOIN LOG ====="
          cat "$ROOT/trade-direct-join.log"

          test "$DIRECT_HOST_RC" -eq 0
          test "$DIRECT_JOIN_RC" -eq 0
          test -s "$DIRECT_ADDR"
          ! grep -q '^localhost:' "$DIRECT_ADDR"
          echo "PASS: Host Direct advertised a non-loopback IP:random-port and a second PKVault connected to it"

      - name: Verify exact TMT v1.6 type palette coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("pkvault-src/frontend/src/romhacks/tmt-type-item.tsx")
          text = p.read_text(encoding="utf-8")

          expected = [
              "normal","fighting","flying","poison","ground","rock","bug","ghost","steel","mystery",
              "fire","water","grass","electric","psychic","ice","dragon","dark","fairy",
              "monke","angy","baby","friend","guys","liquid","vibe","song","space","fluffy","sus",
              "furry","bad","ancient","silly","stinky","sharp","magic","gender","little","crab",
              "dream","right","left","zoomer","gamer","dance","boring","ugly","emerald","gun",
              "pikachu","prime","ohio","deez nuts","normal2","bean","boomer","smash","ou","ball",
              "sans","reverse","type",
          ]

          body = text.split("TMT_TYPE_STYLES", 1)[1].split("};", 1)[0]
          found = set(re.findall(r"^\s*(?:'([^']+)'|([a-zA-Z0-9]+)):\s*\{", body, re.M))
          found = {a or b for a, b in found}

          missing = [t for t in expected if t not in found]
          extra = sorted(found - set(expected))
          if missing or extra or len(found) != 63:
              raise SystemExit(f"TMT palette coverage mismatch: missing={missing} extra={extra} count={len(found)}")

          required_fragments = {
              "Furry v1.6 blue": "furry:     { background: '#6A94F6' }",
              "Magic v1.6 pink": "magic:     { background: '#FF5A8B' }",
              "Gender split": "linear-gradient(90deg, #9CDEDE 0 50%, #DE83BD 50% 100%)",
              "Smash split": "linear-gradient(90deg, #F68331 0 64%, #C53129 64% 100%)",
              "Sans split": "linear-gradient(90deg, #000000 0 58%, #FFFFFF 58% 100%)",
          }
          for label, fragment in required_fragments.items():
              if fragment not in text:
                  raise SystemExit(f"Missing exact TMT palette check: {label}")

          print("PASS: all 63 TMT v1.6 types have dedicated color styling")
          PY

