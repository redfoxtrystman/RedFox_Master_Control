          test "$TMT_COUNT" -eq 10
          test "$PK3_COUNT" -eq 15
          test "$PK1_COUNT" -eq 15
          test "$PK2_COUNT" -eq 15
          test "$TOTAL" -eq 55

          echo "PASS: seeded 55 mixed-format Pokemon: 10 TMT + 15 Emerald + 15 Gen1 + 15 Gen2"

      - name: PKVault Gen1 glitch enablement smoke test
        run: |
          mkdir -p vault-smoke
          cat > vault-smoke/vault-smoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../pkvault-src/PKVault.Core/PKVault.Core.csproj" />
              <Reference Include="PKHeX.Core">
                <HintPath>../pkvault-src/PKVault.Core/PKHeX.Core.dll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          cat > vault-smoke/Program.cs <<'EOF'
          using PKHeX.Core;
          using PKVault.Core;

          static void Need(bool value, string message)
          {
              if (!value) throw new Exception(message);
          }

          var raw00 = new PK1();
          raw00.SpeciesInternal = 0;
          raw00.CatchRate = 45;
          raw00.EXP = 12345;
          raw00.Stat_LevelBox = 20;

          var raw50 = new PK1();
          raw50.SpeciesInternal = 0x50;
          raw50.CatchRate = 45;
          raw50.EXP = 54321;
          raw50.Stat_LevelBox = 92;

          var blank = new PK1();

          Need(new ImmutablePKM(raw00).IsEnabled, "'M raw-00 should be enabled");
          Need(new ImmutablePKM(raw50).IsEnabled, "MissingNo raw-50 should be enabled");
          Need(!new ImmutablePKM(blank).IsEnabled, "blank PK1 must remain disabled");
          Need(new ImmutablePKM(raw00).IsGen1Glitch, "'M raw-00 glitch identity missing");
          Need(new ImmutablePKM(raw50).IsGen1Glitch, "MissingNo raw-50 glitch identity missing");

          Console.WriteLine("PASS: PKVault enables raw00 + raw50 glitches and rejects blank PK1");
          EOF
          dotnet run --project vault-smoke/vault-smoke.csproj -c Release

      - name: Direct trading two-profile end-to-end test
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          HARNESS="$ROOT/pkvault-rebuild/trading-smoke/trading-smoke.csproj"
          SEED_A="$ROOT/trade-test/seed-A"
          SEED_B="$ROOT/trade-test/seed-B"
