          (
            cd "$GITHUB_WORKSPACE/dist"
            zip -9 -r PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-FULL-SOURCE.zip PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-FULL-SOURCE
            sha256sum PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-FULL-SOURCE.zip > PKVault-v8.0.0-alpha33-Uranium-Overlay-Dex-FULL-SOURCE.zip.sha256
