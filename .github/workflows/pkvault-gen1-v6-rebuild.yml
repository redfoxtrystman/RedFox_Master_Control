          sha256sum dist/PKVault-v8.0.0-alpha7-TMT-Online-Trading-Dex-Test-win-x64.zip \
            | tee dist/PKVault-v8.0.0-alpha7-TMT-Online-Trading-Dex-Test-win-x64.sha256
          ls -lah dist
          find dist/PKVault-v8.0.0-alpha7-TMT-Online-Trading-Dex-Test -maxdepth 3 -type f -print | sort

