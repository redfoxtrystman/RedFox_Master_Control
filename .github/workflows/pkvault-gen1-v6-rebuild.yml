          RedFox build branch: pkvault-v8-uranium-insurgence

          Contents:
          - PKVault/        Exact patched PKVault source tree compiled for v8.0.0-alpha33-Uranium-Overlay-Dex.
          - PKHeX/          Exact patched PKHeX source tree used to build PKHeX.Core.
          - RedFox-Rebuild/ Reconstruction patcher, trading sources, and trading smoke harness.
          - GitHub-Workflow/Exact workflow used to reconstruct, test, package, and build v8.0.0-alpha33-Uranium-Overlay-Dex.
          - SOURCE_FILE_SHA256SUMS.txt hashes every file in this source snapshot.

          Reproduction:
          1. Build PKHeX/PKHeX.Core/PKHeX.Core.csproj with .NET 10 Release.
          2. Copy the resulting PKHeX.Core.dll to PKVault/PKVault.Core/PKHeX.Core.dll.
          3. Build PKVault normally or use its Dockerfile desktop target for win-x64.

          This archive exists specifically so future PKVault versions never depend on
          recovering source from an EXE or from a GitHub Actions runner.
          EOF

          (
            cd "$SOURCE_ROOT"
            find . -type f ! -name SOURCE_FILE_SHA256SUMS.txt -print0 |
              sort -z |
              xargs -0 sha256sum > SOURCE_FILE_SHA256SUMS.txt
