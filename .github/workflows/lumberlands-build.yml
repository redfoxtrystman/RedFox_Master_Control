name: LumberLands 0.2.1 Build

on:
  push:
    branches:
      - chatgpt-lumberlands-build-v0.2.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct LumberLands source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .chatgpt_builds/lumberlands
          base64 -d .chatgpt_builds/lumberlands-source.b64 > /tmp/LumberLands-source.zip
          unzip -q /tmp/LumberLands-source.zip -d .chatgpt_builds/lumberlands
          ls -la .chatgpt_builds/lumberlands

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Build LumberLands
        working-directory: .chatgpt_builds/lumberlands
        run: gradle --no-daemon clean universalJar --stacktrace

      - name: Collect jars
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-artifacts
          find .chatgpt_builds/lumberlands -type f -name '*.jar' -print -exec cp {} build-artifacts/ \;
          ls -lah build-artifacts

      - name: Upload compiled LumberLands jars
        uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.2.1-LT2-parity-compiled
          path: build-artifacts/*.jar
          if-no-files-found: error
