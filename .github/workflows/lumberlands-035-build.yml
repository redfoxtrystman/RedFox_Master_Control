name: LumberLands 0.3.5 Universal Corrections Build
on:
  push:
    branches: [chatgpt-lumberlands-035-render-physics-frost]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and apply corrections through 0.3.5
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/project
          base64 -d .chatgpt_builds/lumberlands-0.3.0-source.b64 > work/source.zip
          unzip -q work/source.zip -d work/project
          cd work/project
          patch --batch --fuzz=0 -p4 < ../../.chatgpt_builds/lumberlands-0.3.0-to-0.3.1.patch
          python3 ../../.chatgpt_builds/lumberlands-032-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-033-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-034-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-035-upgrade.py
          grep -q '^mod_version=0.3.5' gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Compile all loaders and assemble one universal JAR
        working-directory: work/project
        run: gradle --no-daemon clean universalJar --stacktrace
      - name: Verify universal JAR and UV data
        shell: bash
        run: |
          set -euxo pipefail
          f=work/project/build/universal/LumberLands-0.3.5+1.21.1-universal.jar
          test -s "$f"
          unzip -t "$f" >/dev/null
          for entry in fabric.mod.json META-INF/mods.toml META-INF/neoforge.mods.toml \
            assets/lumberlands/meshes/lt2_original_axe.bin \
            assets/lumberlands/textures/item/lt2_original_axe.png \
            com/glaziolaicefox/lumberlands/client/Lt2OriginalAxeRenderer.class \
            com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.class; do
              jar tf "$f" | grep -q -F "$entry"
          done
          python3 - <<'PY'
          import zipfile,struct
          f='work/project/build/universal/LumberLands-0.3.5+1.21.1-universal.jar'
          with zipfile.ZipFile(f) as z:
             m=z.read('assets/lumberlands/meshes/lt2_original_axe.bin')
             assert struct.unpack('>i',m[:4])[0] == 6504
             assert len(m)==4+6504*32
             assert 'lumberlands.mixins.json' in z.namelist()
          print('Original axe mesh and loader descriptors verified.')
          PY
          mkdir -p out
          cp "$f" out/
          sha256sum out/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.3.5-universal
          path: out/LumberLands-0.3.5+1.21.1-universal.jar
          if-no-files-found: error
