name: LumberLands Mapping Sources

on:
  push:
    branches:
      - chatgpt-lumberlands-0.2.3
  workflow_dispatch:

jobs:
  mappings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Fabric intermediary and Mojang mappings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/mappings
          curl -L --fail --retry 3 -o work/mappings/intermediary-1.21.1-v2.jar https://maven.fabricmc.net/net/fabricmc/intermediary/1.21.1/intermediary-1.21.1-v2.jar
          python3 - <<'PY'
          import json, urllib.request
          manifest=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          u=next(v['url'] for v in manifest['versions'] if v['id']=='1.21.1')
          meta=json.load(urllib.request.urlopen(u))
          for key,name in [('client_mappings','client.txt'),('server_mappings','server.txt')]:
              urllib.request.urlretrieve(meta['downloads'][key]['url'], 'work/mappings/'+name)
          PY
          jar tf work/mappings/intermediary-1.21.1-v2.jar | head
          wc -c work/mappings/*
      - uses: actions/upload-artifact@v4
        with:
          name: lumberlands-mapping-sources
          path: work/mappings
          if-no-files-found: error
