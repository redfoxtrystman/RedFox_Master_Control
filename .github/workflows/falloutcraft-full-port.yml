name: FalloutCraft Full Port

on:
  push:
    branches:
      - falloutcraft-full-skycraft-port
    paths:
      - 'projects/FalloutCraft/source/full_port/BUILD_TRIGGER'
  workflow_dispatch:

jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build full Minecraft half
        working-directory: projects/FalloutCraft/source/full_port/fabric
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FalloutCraft-Fabric-FullPort
          path: projects/FalloutCraft/source/full_port/fabric/build/libs/*.jar

  f4se:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CommonLibF4 reference workspace
        shell: pwsh
        run: git clone --depth 1 https://github.com/DCCStudios/F4SEMenuFramework _deps/F4SEMenuFramework
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg _deps/vcpkg
          .\_deps\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure full F4SE host
        shell: pwsh
        working-directory: projects/FalloutCraft/source/full_port/f4se
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/_deps/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCOMMONLIBF4_PATH="$env:GITHUB_WORKSPACE/_deps/F4SEMenuFramework/extern/commonlibf4"
      - name: Build full F4SE host
        shell: pwsh
        working-directory: projects/FalloutCraft/source/full_port/f4se
        run: cmake --build build --config Release --target FalloutCraft
      - uses: actions/upload-artifact@v4
        with:
          name: FalloutCraft-F4SE-FullPort
          path: projects/FalloutCraft/source/full_port/f4se/build/out/FalloutCraft.dll

  package:
    needs: [fabric, f4se]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FalloutCraft-Fabric-FullPort
          path: _artifacts/fabric
      - uses: actions/download-artifact@v4
        with:
          name: FalloutCraft-F4SE-FullPort
          path: _artifacts/f4se
      - name: Build install ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Data/F4SE/Plugins | Out-Null
          New-Item -ItemType Directory -Force dist/mods | Out-Null
          $dll = Get-ChildItem _artifacts/f4se -Recurse -Filter FalloutCraft.dll | Select-Object -First 1
          if (-not $dll) { throw 'FalloutCraft.dll artifact missing' }
          Copy-Item $dll.FullName dist/Data/F4SE/Plugins/FalloutCraft.dll
          $jar = Get-ChildItem _artifacts/fabric -Recurse -Filter *.jar | Where-Object { $_.Name -notmatch 'sources|javadoc|dev' } | Select-Object -First 1
          if (-not $jar) { throw 'FalloutCraft Fabric jar artifact missing' }
          Copy-Item $jar.FullName dist/mods/FalloutCraft-fabric-0.1.0.jar
          Copy-Item projects/FalloutCraft/source/full_port/README_ALPHA.txt dist/README_FULL_PORT_ALPHA.txt
          Compress-Archive -Path dist/* -DestinationPath FalloutCraft_v0.5.0_FULL_PORT_ALPHA.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FalloutCraft-v0.5.0-FULL-PORT-ALPHA
          path: FalloutCraft_v0.5.0_FULL_PORT_ALPHA.zip
