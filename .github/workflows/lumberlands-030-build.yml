name: LumberLands 0.3.0 Build
on:
  push:
    branches: [chatgpt-lumberlands-030-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work && mkdir -p work/project
          base64 -d .chatgpt_builds/lumberlands-0.3.0-source.b64 > work/source.zip
          unzip -q work/source.zip -d work/project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Build
        working-directory: work/project
        run: gradle --no-daemon clean universalJar --stacktrace
      - name: Fabric startup smoke
        shell: bash
        working-directory: work/project
        run: |
          set +e
          timeout 110s xvfb-run -a gradle --no-daemon :fabric:runClient > fabric-smoke.log 2>&1
          code=$?
          set -e
          if grep -E "InvalidInterfaceMixinException|Mixin apply for mod lumberlands failed|Minecraft has crashed|Mixin transformation .* failed|lumberlands.*FAILED during APPLY" fabric-smoke.log; then
            cat fabric-smoke.log
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            tail -n 250 fabric-smoke.log
            exit "$code"
          fi
          tail -n 100 fabric-smoke.log
      - name: Verify jars
        shell: bash
        run: |
          set -euxo pipefail
          for f in work/project/build/universal/LumberLands-0.3.0+1.21.1-universal.jar work/project/fabric/build/libs/LumberLands-0.3.0+1.21.1-fabric.jar work/project/forge/build/libs/LumberLands-0.3.0+1.21.1-forge.jar work/project/neoforge/build/libs/LumberLands-0.3.0+1.21.1-neoforge.jar; do
            unzip -t "$f" >/dev/null
            jar tf "$f" | grep -q 'com/glaziolaicefox/lumberlands/entity/Lt2TreeVisualEntity.class'
            jar tf "$f" | grep -q 'com/glaziolaicefox/lumberlands/axe/Lt2AxeItem.class'
            jar tf "$f" | grep -q 'com/glaziolaicefox/lumberlands/mixin/Lt2AxeThirdPersonMixin.class'
          done
      - name: Collect jars
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp work/project/build/universal/LumberLands-0.3.0+1.21.1-universal.jar out/
          cp work/project/fabric/build/libs/LumberLands-0.3.0+1.21.1-fabric.jar out/
          cp work/project/forge/build/libs/LumberLands-0.3.0+1.21.1-forge.jar out/
          cp work/project/neoforge/build/libs/LumberLands-0.3.0+1.21.1-neoforge.jar out/
          sha256sum out/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.3.0-compiled
          path: out/*.jar
          if-no-files-found: error
