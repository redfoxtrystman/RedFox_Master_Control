name: LumberLands Mapping Dump

on:
  push:
    branches:
      - chatgpt-lumberlands-0.2.3
  workflow_dispatch:

jobs:
  mappings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct build shell
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/project
          base64 -d .chatgpt_builds/lumberlands-build-shell.b64 > /tmp/LumberLands-shell.zip
          unzip -q /tmp/LumberLands-shell.zip -d work/project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Materialize Loom mappings
        working-directory: work/project
        run: gradle --no-daemon :fabric:dependencies >/dev/null
      - name: Collect tiny mappings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/mappings
          find work/project/.gradle work/project/fabric/.gradle -type f 2>/dev/null | while read f; do
            if head -c 16 "$f" 2>/dev/null | grep -aq 'tiny'; then
              if grep -aEq 'intermediary|named|official' "$f"; then
                cp "$f" "work/mappings/$(echo "$f" | sed 's#[/ ]#_#g')" || true
              fi
            fi
          done
          find work/mappings -type f -maxdepth 1 -print
      - uses: actions/upload-artifact@v4
        with:
          name: lumberlands-loom-mappings
          path: work/mappings
          if-no-files-found: error
