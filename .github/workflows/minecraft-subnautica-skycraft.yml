name: Minecraft Subnautica SkyCraft

on:
  push:
    branches:
      - minecraft-subnautica-universal-bridge
    paths:
      - "projects/FalloutCraft/source/full_port/fabric/**"
      - ".github/workflows/minecraft-subnautica-skycraft.yml"
  pull_request:
    paths:
      - "projects/FalloutCraft/source/full_port/fabric/**"
      - ".github/workflows/minecraft-subnautica-skycraft.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/FalloutCraft/source/full_port/fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build SkyCraft
        run: ./gradlew build --no-daemon --no-configuration-cache
