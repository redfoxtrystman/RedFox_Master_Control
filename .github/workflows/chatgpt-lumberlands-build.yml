name: Temporary LumberLands Build

on:
  push:
    branches:
      - chatgpt-lumberlands-build-v0.1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct LumberLands source archive
        run: |
          mkdir -p .chatgpt_builds/lumberlands
          cat .chatgpt_builds/lumberlands_chunks/chunk00               .chatgpt_builds/lumberlands_chunks/chunk01               .chatgpt_builds/lumberlands_chunks/chunk02               .chatgpt_builds/lumberlands_chunks/chunk03               .chatgpt_builds/lumberlands_chunks/chunk04               .chatgpt_builds/lumberlands_chunks/chunk05               | base64 -d > .chatgpt_builds/LumberLands-ci-source.zip
          unzip -q .chatgpt_builds/LumberLands-ci-source.zip -d .chatgpt_builds/lumberlands

      - name: Fix magma plank block properties
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.chatgpt_builds/lumberlands')
          files = [
              root/'fabric/src/main/java/com/glaziolaicefox/lumberlands/fabric/LumberLandsFabric.java',
              root/'forge/src/main/java/com/glaziolaicefox/lumberlands/forge/LumberLandsForge.java',
              root/'neoforge/src/main/java/com/glaziolaicefox/lumberlands/neoforge/LumberLandsNeoForge.java',
          ]
          needle = '''    private static BlockBehaviour.Properties woodProperties(int light) {\n        return BlockBehaviour.Properties.ofFullCopy(Blocks.OAK_LOG)\n                .strength(2.0F)\n                .sound(SoundType.WOOD)\n                .lightLevel(state -> light);\n    }\n'''
          add = needle + '''\n    private static BlockBehaviour.Properties plankProperties(int light) {\n        return BlockBehaviour.Properties.ofFullCopy(Blocks.OAK_PLANKS)\n                .strength(2.0F)\n                .sound(SoundType.WOOD)\n                .lightLevel(state -> light);\n    }\n'''
          for p in files:
              s = p.read_text()
              s = s.replace('new Block(woodProperties(0))', 'new Block(plankProperties(0))')
              if 'plankProperties(int light)' not in s:
                  if needle not in s:
                      raise RuntimeError(f'Expected property helper not found in {p}')
                  s = s.replace(needle, add)
              p.write_text(s)
          PY

      - name: Patch loader build scripts
        run: |
          cat > .chatgpt_builds/lumberlands/build.gradle <<'EOF'
          buildscript {
              repositories {
                  maven { url 'https://maven.fabricmc.net/' }
                  maven { url 'https://maven.architectury.dev/' }
                  maven { url 'https://maven.minecraftforge.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
              dependencies {
                  classpath 'dev.architectury.loom:dev.architectury.loom.gradle.plugin:1.13-SNAPSHOT'
                  classpath 'net.minecraftforge.gradle:net.minecraftforge.gradle.gradle.plugin:[7.0.17,8.0)'
              }
          }

          allprojects {
              group = rootProject.mod_group
              version = rootProject.mod_version
          }

          subprojects {
              if (project.name == 'fabric') {
                  apply plugin: 'dev.architectury.loom'
              } else if (project.name == 'forge') {
                  apply plugin: 'java'
                  apply plugin: 'net.minecraftforge.gradle'
              }

              repositories {
                  maven { url 'https://maven.fabricmc.net/' }
                  maven { url 'https://maven.neoforged.net/releases/' }
                  maven { url 'https://maven.minecraftforge.net/' }
                  mavenCentral()
              }

              if (project.name == 'fabric') {
                  dependencies {
                      minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
                      mappings loom.officialMojangMappings()
                  }
              }

              if (project.name != 'neoforge') {
                  java {
                      toolchain {
                          languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
                      }
                      withSourcesJar()
                  }

                  tasks.withType(JavaCompile).configureEach {
                      options.encoding = 'UTF-8'
                      options.release = rootProject.java_version as int
                  }
              }
          }

          tasks.register('universalJar', Jar) {
              group = 'build'
              description = 'Builds and merges Fabric, Forge, and NeoForge 1.21.1 production jars.'
              dependsOn ':fabric:remapJar', ':forge:jar', ':neoforge:jar'

              archiveBaseName = rootProject.archives_name
              archiveVersion = "${rootProject.mod_version}+${rootProject.minecraft_version}"
              archiveClassifier = 'universal'
              destinationDirectory = layout.buildDirectory.dir('universal')
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE

              from({ zipTree(project(':fabric').tasks.named('remapJar').get().archiveFile.get().asFile) })
              from({ zipTree(project(':forge').tasks.named('jar').get().archiveFile.get().asFile) })
              from({ zipTree(project(':neoforge').tasks.named('jar').get().archiveFile.get().asFile) })

              exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
          }
          EOF

          cat > .chatgpt_builds/lumberlands/fabric/build.gradle <<'EOF'
          dependencies {
              modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
          }

          sourceSets.main.resources.srcDir rootProject.file('src/main/resources')

          processResources {
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE
              inputs.property 'version', project.version
              filesMatching('fabric.mod.json') {
                  expand(
                      version: project.version,
                      minecraft_version: rootProject.minecraft_version
                  )
              }
          }

          loom {
              runs {
                  client { client(); runDir("run") }
                  server { server(); runDir("run") }
              }
          }

          remapJar {
              archiveBaseName = rootProject.archives_name
              archiveVersion = "${rootProject.mod_version}+${rootProject.minecraft_version}-fabric"
              archiveClassifier = null
          }
          EOF

          cat > .chatgpt_builds/lumberlands/forge/build.gradle <<'EOF'
          minecraft {
              runs {
                  configureEach {
                      workingDir = layout.projectDirectory.dir('run')
                  }
                  register('client')
                  register('server')
              }
          }

          repositories {
              clear()
              minecraft.mavenizer(it)
              maven fg.forgeMaven
              maven fg.minecraftLibsMaven
              mavenCentral()
          }

          dependencies {
              implementation minecraft.dependency("net.minecraftforge:forge:${rootProject.forge_version}")
          }

          sourceSets.main.resources.srcDir rootProject.file('src/main/resources')

          sourceSets.each {
              def outputDir = layout.buildDirectory.dir("sourceSets/$it.name")
              it.output.resourcesDir = outputDir
              it.java.destinationDirectory = outputDir
          }

          processResources {
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE
              inputs.property 'version', project.version
              filesMatching('META-INF/mods.toml') {
                  expand(
                      version: project.version,
                      minecraft_version: rootProject.minecraft_version,
                      forge_version: rootProject.forge_version
                  )
              }
          }

          jar {
              archiveBaseName = rootProject.archives_name
              archiveVersion = "${rootProject.mod_version}+${rootProject.minecraft_version}-forge"
              archiveClassifier = null
          }
          EOF

          cat > .chatgpt_builds/lumberlands/neoforge/build.gradle <<'EOF'
          plugins {
              id 'java-library'
              id 'net.neoforged.moddev' version '2.0.148'
          }

          base {
              archivesName = rootProject.archives_name
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
              }
              withSourcesJar()
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
              options.release = rootProject.java_version as int
          }

          neoForge {
              version = rootProject.neoforge_version

              runs {
                  client { client() }
                  server { server(); programArgument '--nogui' }
              }

              mods {
                  lumberlands {
                      sourceSet(sourceSets.main)
                  }
              }
          }

          sourceSets.main.resources.srcDir rootProject.file('src/main/resources')

          processResources {
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE
              inputs.property 'version', project.version
              filesMatching('META-INF/neoforge.mods.toml') {
                  expand(
                      version: project.version,
                      minecraft_version: rootProject.minecraft_version,
                      neoforge_version: rootProject.neoforge_version
                  )
              }
          }

          jar {
              archiveBaseName = rootProject.archives_name
              archiveVersion = "${rootProject.mod_version}+${rootProject.minecraft_version}-neoforge"
              archiveClassifier = null
          }
          EOF

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build universal jar
        working-directory: .chatgpt_builds/lumberlands
        run: gradle --no-daemon clean universalJar --stacktrace

      - name: Fabric startup smoke test
        working-directory: .chatgpt_builds/lumberlands
        run: |
          mkdir -p fabric/run
          echo 'eula=true' > fabric/run/eula.txt
          set +e
          timeout 45s gradle --no-daemon :fabric:runServer > fabric-smoke.log 2>&1
          code=$?
          set -e
          cat fabric-smoke.log
          if grep -q "Could not execute entrypoint.*lumberlands" fabric-smoke.log; then
            echo "LumberLands Fabric entrypoint crashed."
            exit 1
          fi
          if grep -q "ExceptionInInitializerError" fabric-smoke.log; then
            echo "Fabric static initialization crashed."
            exit 1
          fi
          if grep -q "Done (" fabric-smoke.log || grep -q "Starting minecraft server version 1.21.1" fabric-smoke.log; then
            echo "Fabric runtime reached server startup successfully."
            exit 0
          fi
          if [ "$code" -eq 124 ]; then
            echo "Server stayed alive for the smoke-test window."
            exit 0
          fi
          exit "$code"

      - name: Upload universal jar
        uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.1.0-1.21.1-universal-fixed-v3
          path: .chatgpt_builds/lumberlands/build/universal/*.jar
          if-no-files-found: error
