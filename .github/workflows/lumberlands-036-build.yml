name: LumberLands 0.3.6 Universal Build
on:
  push:
    branches: [chatgpt-lumberlands-036-authentic-animations-physics]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and apply verified corrections
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/project
          base64 -d .chatgpt_builds/lumberlands-0.3.0-source.b64 > work/source.zip
          unzip -q work/source.zip -d work/project
          cd work/project
          patch --batch --fuzz=0 -p4 < ../../.chatgpt_builds/lumberlands-0.3.0-to-0.3.1.patch
          python3 ../../.chatgpt_builds/lumberlands-032-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-033-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-034-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-035-upgrade.py
          python3 ../../.chatgpt_builds/lumberlands-036-upgrade.py
          grep -q '^mod_version=0.3.6' gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Compile Fabric Forge and NeoForge universal JAR
        working-directory: work/project
        run: gradle --no-daemon clean universalJar --stacktrace
      - name: Check single JAR build and required native assets
        shell: bash
        run: |
          set -euxo pipefail
          f=work/project/build/universal/LumberLands-0.3.6+1.21.1-universal.jar
          test -s "$f"
          unzip -t "$f" >/dev/null
          for entry in fabric.mod.json META-INF/mods.toml META-INF/neoforge.mods.toml \
            assets/lumberlands/meshes/lt2_original_axe.bin \
            assets/lumberlands/textures/item/lt2_original_axe.png \
            com/glaziolaicefox/lumberlands/client/Lt2OriginalAxeRenderer.class \
            com/glaziolaicefox/lumberlands/mixin/Lt2AxeThirdPersonMixin.class \
            com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.class; do
             jar tf "$f" | grep -q -F "$entry"
          done
          mkdir -p out
          cp "$f" out/
          sha256sum out/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.3.6-universal
          path: out/LumberLands-0.3.6+1.21.1-universal.jar
          if-no-files-found: error
