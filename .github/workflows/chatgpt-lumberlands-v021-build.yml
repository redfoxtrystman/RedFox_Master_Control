name: Build LumberLands 0.2.1

on:
  push:
    branches:
      - chatgpt-lumberlands-v0.2.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct 0.2.0 source
        run: |
          rm -rf .chatgpt_builds/lumberlands_v021_src
          mkdir -p .chatgpt_builds/lumberlands_v021_src
          cat .chatgpt_builds/lumberlands_v020_full/chunk* | base64 -d > .chatgpt_builds/LumberLands-0.2.0-source.zip
          unzip -q .chatgpt_builds/LumberLands-0.2.0-source.zip -d .chatgpt_builds/lumberlands_v021_src

      - name: Verify 0.2.1 payload chunks
        run: |
          sha256sum .chatgpt_builds/lumberlands_v021_delta/chunk00
          sha256sum .chatgpt_builds/lumberlands_v021_delta/chunk01
          sha256sum .chatgpt_builds/lumberlands_v021_delta/chunk02
          sha256sum .chatgpt_builds/lumberlands_v021_delta/chunk03
          sha256sum .chatgpt_builds/lumberlands_v021_delta/chunk04
          sha256sum .chatgpt_builds/lumberlands_v021_delta/chunk05
          sha256sum .chatgpt_builds/lumberlands_v021_delta/c6_00
          sha256sum .chatgpt_builds/lumberlands_v021_delta/c6_01
          sha256sum .chatgpt_builds/lumberlands_v021_delta/c6_02
          sha256sum .chatgpt_builds/lumberlands_v021_delta/c6_03
          sha256sum .chatgpt_builds/lumberlands_v021_delta/c6_04
          sha256sum .chatgpt_builds/lumberlands_v021_delta/c6_05
          echo "73b142c6631c9a7cfca1c6574630cfdfd817dd78914709583259d447aeae1192  .chatgpt_builds/lumberlands_v021_delta/chunk00" | sha256sum -c -
          echo "5af7c32aa25dbd361bf435a96f77894d19d7d9061da5a7886d581b0f2c80fcde  .chatgpt_builds/lumberlands_v021_delta/chunk01" | sha256sum -c -
          echo "c31d350a2b88bb655f9e5ec119a7e9a03ebfa9587b2a69a5df8eeb7db396a6b0  .chatgpt_builds/lumberlands_v021_delta/chunk02" | sha256sum -c -
          echo "af1af9fe381cb6aa0a58e9c2252a020b43db64c09062243f10e258ec4d0772f0  .chatgpt_builds/lumberlands_v021_delta/chunk03" | sha256sum -c -
          echo "922951fa9b19153abee089e3dc443ca8b45cbe5621303211db2c9213d98e0c6b  .chatgpt_builds/lumberlands_v021_delta/chunk04" | sha256sum -c -
          echo "044494f0833bd5224757ec53349e4c8e07bb7615e2d4602d81ececbb73c085d0  .chatgpt_builds/lumberlands_v021_delta/chunk05" | sha256sum -c -
          echo "a618e22eb9857432e3851e87853cfd18d19d203e715a7ea3bc4078433d860545  .chatgpt_builds/lumberlands_v021_delta/c6_00" | sha256sum -c -
          echo "97c9d403f3821b5bd768e925b6596e467c77b3f0de8697359a5b97b12881945b  .chatgpt_builds/lumberlands_v021_delta/c6_01" | sha256sum -c -
          echo "46b959d79b019fcd707617e3435dbc9664c2a30e43a130603fe50a9b477f1523  .chatgpt_builds/lumberlands_v021_delta/c6_02" | sha256sum -c -
          echo "591942eb833918140438b0530124a8910012359029b6b2257828957a3ce7f167  .chatgpt_builds/lumberlands_v021_delta/c6_03" | sha256sum -c -
          echo "cdf3beede6b8a02813f7c8771a9e800402e3356631a8a4c0817cf39001579527  .chatgpt_builds/lumberlands_v021_delta/c6_04" | sha256sum -c -
          echo "d5511abcbda917730374e1be58477c5f9d8fd02ce7508c15d15e44f3b2e63ef5  .chatgpt_builds/lumberlands_v021_delta/c6_05" | sha256sum -c -

      - name: Reconstruct and overlay 0.2.1 delta
        run: |
          cat .chatgpt_builds/lumberlands_v021_delta/chunk00 .chatgpt_builds/lumberlands_v021_delta/chunk01 .chatgpt_builds/lumberlands_v021_delta/chunk02 .chatgpt_builds/lumberlands_v021_delta/chunk03 .chatgpt_builds/lumberlands_v021_delta/chunk04 .chatgpt_builds/lumberlands_v021_delta/chunk05 .chatgpt_builds/lumberlands_v021_delta/c6_00 .chatgpt_builds/lumberlands_v021_delta/c6_01 .chatgpt_builds/lumberlands_v021_delta/c6_02 .chatgpt_builds/lumberlands_v021_delta/c6_03 .chatgpt_builds/lumberlands_v021_delta/c6_04 .chatgpt_builds/lumberlands_v021_delta/c6_05 | base64 -d > .chatgpt_builds/LumberLands-0.2.1-delta.zip
          sha256sum .chatgpt_builds/LumberLands-0.2.1-delta.zip
          echo "d4a62c5655cd1383cc8b640308a14628a707f1aa9c77e8065cf285cbbff0b82a  .chatgpt_builds/LumberLands-0.2.1-delta.zip" | sha256sum -c -
          unzip -qo .chatgpt_builds/LumberLands-0.2.1-delta.zip -d .chatgpt_builds/lumberlands_v021_src

      - name: Verify source version and key fixes
        run: |
          grep -q '^mod_version=0.2.1$' .chatgpt_builds/lumberlands_v021_src/gradle.properties
          grep -q 'STUD_TO_BLOCK = 1.8 / 5.0' .chatgpt_builds/lumberlands_v021_src/src/main/java/com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.java
          grep -q 'plantNatural' .chatgpt_builds/lumberlands_v021_src/src/main/java/com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.java
          grep -q 'obbVsAabbMtv' .chatgpt_builds/lumberlands_v021_src/src/main/java/com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.java
          grep -q 'lumberlands_tree_section_proxy' .chatgpt_builds/lumberlands_v021_src/src/main/java/com/glaziolaicefox/lumberlands/tree/Lt2TreeRuntime.java

      - name: Patch Forge 1.21.1 tick event registration if needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.chatgpt_builds/lumberlands_v021_src/forge/src/main/java/com/glaziolaicefox/lumberlands/forge/LumberLandsForge.java')
          s = p.read_text()
          if 'TickEvent.ServerTickEvent.Post.BUS.addListener' in s:
              if 'import net.minecraftforge.common.MinecraftForge;' not in s:
                  s = s.replace('import net.minecraftforge.event.TickEvent;\n',
                                'import net.minecraftforge.event.TickEvent;\nimport net.minecraftforge.common.MinecraftForge;\n')
              s = s.replace(
                  'TickEvent.ServerTickEvent.Post.BUS.addListener(event -> Lt2TreeRuntime.tick(event.getServer()));',
                  'MinecraftForge.EVENT_BUS.addListener((TickEvent.ServerTickEvent.Post event) -> Lt2TreeRuntime.tick(event.getServer()));'
              )
              p.write_text(s)
          PY

      - name: Package final source
        run: |
          cd .chatgpt_builds/lumberlands_v021_src
          zip -qr ../LumberLands-0.2.1-source.zip .

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build universal jar
        working-directory: .chatgpt_builds/lumberlands_v021_src
        run: gradle --no-daemon clean universalJar --stacktrace

      - name: Fabric startup smoke test
        working-directory: .chatgpt_builds/lumberlands_v021_src
        run: |
          mkdir -p fabric/run
          echo 'eula=true' > fabric/run/eula.txt
          set +e
          timeout 75s gradle --no-daemon :fabric:runServer > fabric-smoke.log 2>&1
          code=$?
          set -e
          cat fabric-smoke.log
          if grep -q "Could not execute entrypoint.*lumberlands" fabric-smoke.log; then exit 1; fi
          if grep -q "ExceptionInInitializerError" fabric-smoke.log; then exit 1; fi
          if grep -q "Failed to start the minecraft server" fabric-smoke.log; then exit 1; fi
          if grep -q "Done (" fabric-smoke.log; then exit 0; fi
          if [ "$code" -eq 124 ]; then exit 0; fi
          exit "$code"

      - name: Upload universal jar
        uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.2.1-1.21.1-universal
          path: .chatgpt_builds/lumberlands_v021_src/build/universal/*.jar
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.2.1-source
          path: .chatgpt_builds/LumberLands-0.2.1-source.zip
          if-no-files-found: error
