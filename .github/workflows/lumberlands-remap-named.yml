name: LumberLands 0.2.2 Remap Named

on:
  push:
    branches:
      - chatgpt-lumberlands-0.2.3
  workflow_dispatch:

jobs:
  remap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct build shell and 0.2.2 jar
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/project
          base64 -d .chatgpt_builds/lumberlands-build-shell.b64 > /tmp/LumberLands-shell.zip
          unzip -q /tmp/LumberLands-shell.zip -d work/project
          base64 -d .chatgpt_builds/lumberlands-0.2.2-universal.b64 > work/project/LumberLands-0.2.2+1.21.1-universal.jar
          cat >> work/project/fabric/build.gradle <<'GRADLE'

          tasks.register('remap022ToNamed', net.fabricmc.loom.task.RemapJarTask) {
              inputFile.set(rootProject.layout.projectDirectory.file('LumberLands-0.2.2+1.21.1-universal.jar'))
              sourceNamespace.set('intermediary')
              targetNamespace.set('named')
              archiveBaseName.set('LumberLands')
              archiveVersion.set('0.2.2+1.21.1')
              archiveClassifier.set('named')
              destinationDirectory.set(rootProject.layout.buildDirectory.dir('named022'))
          }
          GRADLE

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Remap 0.2.2 intermediary to Mojang named
        working-directory: work/project
        run: gradle --no-daemon :fabric:remap022ToNamed --stacktrace

      - name: Download CFR
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o work/cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar

      - name: Decompile remapped jar
        shell: bash
        run: |
          set -euxo pipefail
          NAMED_JAR=$(find work/project/build/named022 -type f -name '*named*.jar' | head -n 1)
          echo "Named jar: $NAMED_JAR"
          mkdir -p work/named-decompiled
          java -jar work/cfr.jar "$NAMED_JAR" --outputdir work/named-decompiled --silent true
          find work/named-decompiled -type f | sort

      - name: Upload named decompile
        uses: actions/upload-artifact@v4
        with:
          name: LumberLands-0.2.2-named-decompiled
          path: work/named-decompiled
          if-no-files-found: error
